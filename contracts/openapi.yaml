    ConfigureChecklist:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - items
      properties:
        expectedVersion:
          $ref: '#/components/schemas/ExpectedVersion'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - title
            properties:
              title:
                examples:
                  - Проверить соответствие выполненных работ проекту
                description: Название контрольной точки, которую необходимо выполнить для передачи этапа на приёмку.
                type: string
                minLength: 1
                maxLength: 500
              photoHint:
                examples:
                  - Фото перевязки углов и перехлёста арматуры
                  - null
                description: Необязательная фотоподсказка; null удаляет подсказку.
                type:
                  - string
                  - 'null'
                minLength: 1
                maxLength: 1000
          minItems: 1
          description: Порядок массива определяет position. Равный вес каждого пункта.
    UpdateChecklistItem:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - isCompleted
      properties:
        expectedVersion:
          $ref: '#/components/schemas/ExpectedVersion'
        isCompleted:
          examples:
            - true
          description: Новое состояние пункта. true отмечает выполнение, false снимает отметку; сервер заполняет или очищает completedAt и completedBy и пересчитывает прогресс.
          type: boolean
  responses:
    ApiBadRequest:
      description: Некорректные поля, формат, даты, неизвестные параметры или неподдерживаемый MIME файла. Для MIME используется код unsupported_mime_type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Bad Request
            code: invalid_request
            message: Плановое окончание не может быть раньше планового начала.
            details:
              - path: body.plannedEndDate
                message: Плановое окончание не может быть раньше планового начала.
    ApiUnauthorized:
      description: Сессионная cookie отсутствует, недействительна, истекла или отозвана. При входе — одинаковая ошибка для неизвестного логина, неверного пароля и неактивной учётной записи.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Unauthorized
            code: unauthenticated
            message: Не удалось подтвердить авторизацию.
    ApiForbidden:
      description: Роль не разрешает эту операцию или изменение поля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Forbidden
            code: forbidden
            message: Недостаточно прав для выполнения операции.
    ApiNotFound:
      description: Запись не существует либо находится вне доступной пользователю области. В частности, запрос мастера к чужому этапу или его вложенному ресурсу возвращает этот ответ и не раскрывает существование записи.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Not Found
            code: not_found
            message: Запись не найдена или недоступна.
    ApiConflict:
      description: Конфликт версии, логина, зависимости, состояния, checksum или upload-сессии. Изменения не применены. Повтор Idempotency-Key с другим телом возвращает idempotency_conflict; файловые операции используют checksum_mismatch, upload_incomplete и upload_expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Conflict
            code: version_conflict
            message: Запись была изменена; обновите данные и повторите запрос.
    ApiTooManyRequests:
      description: Превышен лимит запросов. Повторите через Retry-After секунд.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Too Many Requests
            code: rate_limited
            message: Превышен лимит запросов. Повторите попытку позже.
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: stageby_session
      description: Защищённая HttpOnly cookie серверной сессии из POST /auth/login. Браузер передаёт её автоматически. Сервер проверяет срок, отзыв, активность пользователя и актуальную роль при каждом запросе.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Количество пропущенных записей после фильтрации и проверки доступа.
      schema:
        type: integer
        minimum: 0
        default: 0
