  /stages/{stageId}/status:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    put:
      operationId: changeStageStatus
      tags:
        - Stages
      summary: Перевести этап в следующий рабочий статус
      description: Только руководитель. Явно разрешён assigned→supplied при наличии хотя бы одного счёта этапа и доставке всех счетов. Статус paid рассчитывается автоматически после приёмки. Старт, переход на приёмку и возврат с доработки выполняются автоматически изменением пунктов. Повтор текущего статуса с актуальной версией возвращает запись без изменения. Остальные переходы — 409 invalid_transition. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStageStatus'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/acceptance:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: acceptStage
      tags:
        - Stages
      summary: Принять этап
      description: Только руководитель. Только из acceptance, при всех выполненных пунктах. Атомарно записывает latestAcceptance с decision=accepted, текущим пользователем, временем и correctionDueDate=null; переводит этап в completed и устанавливает actualEndDate. Это электронная отметка приёмки, не PDF и не юридически значимая подпись. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/rework:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: returnStageForRework
      tags:
        - Stages
      summary: Вернуть этап на доработку
      description: Только руководитель. Только из acceptance. Индивидуальные замечания items обязательны; дата не раньше текущей даты объекта. По умолчанию сегодня + 2 календарных дня. Все items[].itemId должны принадлежать этому чек-листу, иначе 400 invalid_request. Переводит в rework, пишет latestAcceptance с decision=rejected и сбрасывает только указанные пункты для повторной проверки (completedAt/completedBy=null), остальные отметки сохраняет. Увеличивает версии этапа и чек-листа атомарно. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/checklist:
