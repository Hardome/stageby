          minimum: 1
          maximum: 8
          example: 2
          description: Порядковый номер выбранного этапа среди включённых этапов объекта.
        stageCount:
          type: integer
          minimum: 1
          maximum: 8
          example: 6
          description: Количество включённых этапов объекта для подписи «N из K».
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Стены
          description: Отображаемое название выбранного этапа.
        plannedStartDate:
          type:
            - string
            - 'null'
          format: date
          example: '2026-10-10'
          description: Плановое начало выбранного этапа или null.
        plannedEndDate:
          type:
            - string
            - 'null'
          format: date
          example: '2026-10-25'
          description: Плановое окончание выбранного этапа или null.
        assignee:
          description: Назначенный мастер выбранного этапа или null.
          anyOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        status:
          $ref: '#/components/schemas/StageStatus'
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
          description: Вычисляемая готовность выбранного этапа.
        materials:
          $ref: '#/components/schemas/MaterialIndicator'
        finances:
          $ref: '#/components/schemas/StageFinancialSummary'
    DashboardProjectRow:
      type: object
      additionalProperties: false
      required:
        - projectId
        - ownerName
        - address
        - status
        - finances
        - selectedStage
      properties:
        projectId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 101
          description: Идентификатор объекта.
        ownerName:
          type: string
          minLength: 1
          maxLength: 255
          example: Анна Смирнова
          description: Имя клиента.
        address:
          type: string
          minLength: 1
          maxLength: 1000
          example: Екатеринбург, ул. Лесная, д. 10
          description: Адрес объекта.
        status:
          $ref: '#/components/schemas/ProjectStatus'
        finances:
          $ref: '#/components/schemas/ProjectFinancialSummary'
        selectedStage:
          description: Первый по позиции невыплаченный этап или null, если все включённые этапы paid. Переходы к счёту, мастеру и чек-листу используют только его stageId.
          anyOf:
            - $ref: '#/components/schemas/DashboardSelectedStage'
            - type: 'null'
    DashboardProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardProjectRow'
          description: Строки текущей страницы в документированном стабильном порядке.
        total:
          type: integer
          minimum: 0
          example: 12
          description: Количество доступных строк до limit и offset.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
          description: Применённый размер страницы.
        offset:
          type: integer
          minimum: 0
          example: 0
          description: Применённое смещение.
  responses:
    ApiBadRequest:
      description: Некорректные поля, формат, даты, неизвестные параметры или неподдерживаемый MIME файла. Для MIME используется код unsupported_mime_type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Bad Request
            code: invalid_request
            message: Плановое окончание не может быть раньше планового начала.
            details:
              - path: body.plannedEndDate
                message: Плановое окончание не может быть раньше планового начала.
    ApiUnauthorized:
      description: Сессионная cookie отсутствует, недействительна, истекла или отозвана. При входе — одинаковая ошибка для неизвестного логина, неверного пароля и неактивной учётной записи.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Unauthorized
            code: unauthenticated
            message: Не удалось подтвердить авторизацию.
    ApiForbidden:
      description: Роль не разрешает эту операцию или изменение поля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Forbidden
            code: forbidden
            message: Недостаточно прав для выполнения операции.
    ApiNotFound:
      description: Запись не существует либо находится вне доступной пользователю области. В частности, запрос мастера к чужому этапу или его вложенному ресурсу возвращает этот ответ и не раскрывает существование записи.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Not Found
            code: not_found
            message: Запись не найдена или недоступна.
    ApiConflict:
      description: Конфликт версии, логина, зависимости, состояния, лимита счетов, checksum или upload-сессии. Изменения не применены. Повтор Idempotency-Key с другим телом возвращает idempotency_conflict; конкурентное превышение десяти счетов — invoice_limit_exceeded; файловые операции используют checksum_mismatch, upload_incomplete и upload_expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Conflict
            code: version_conflict
            message: Запись была изменена; обновите данные и повторите запрос.
    ApiTooManyRequests:
      description: Превышен лимит запросов. Повторите через Retry-After секунд.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Too Many Requests
            code: rate_limited
            message: Превышен лимит запросов. Повторите попытку позже.
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
    InvoiceConflict:
      description: Лимит десять счетов исчерпан, файл уже привязан либо состояние ресурса конфликтует. Изменения не применены.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invoiceLimitExceeded:
              value:
                error: Conflict
                code: invoice_limit_exceeded
                message: На этапе уже создано максимально допустимое количество счетов.
    ApiPayloadTooLarge:
      description: Файл превышает допустимый для его назначения размер. Upload-сессия не завершается.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: Payload Too Large
            code: file_too_large
            message: Размер файла превышает допустимый предел.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: stageby_session
      description: Защищённая HttpOnly cookie серверной сессии из POST /auth/login. Браузер передаёт её автоматически. Сервер проверяет срок, отзыв, активность пользователя и актуальную роль при каждом запросе.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Количество пропущенных записей после фильтрации и проверки доступа.
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ безопасного повтора операции после потери ответа. Повтор с другим телом возвращает 409 idempotency_conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 100
        pattern: ^[A-Za-z0-9._:-]+$
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
