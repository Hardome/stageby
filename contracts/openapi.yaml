  /stages/{stageId}/checklist/items/{itemId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: itemId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    patch:
      operationId: updateChecklistItem
      tags:
        - Checklists
      summary: Отметить или снять выполнение пункта
      description: Руководитель или назначенный мастер. Первый явно выполненный пункт начинает этап из assigned или supplied, устанавливает actualStartDate и возвращает предупреждение materials_incomplete при старте из assigned. Если непосредственно предыдущий включённый этап ещё не completed/paid, также возвращает predecessor_incomplete, но не блокирует выполнение. Для isCompleted=true нужна хотя бы одна успешно загруженная активная фотография; при доработке она должна быть загружена после последнего возврата этого пункта. Сама загрузка фотографии пункт не выполняет. itemId должен принадлежать чек-листу данного этапа, иначе 404. expectedVersion — версия всего чек-листа. false→true устанавливает completedAt и completedBy на сервере; true→false очищает их. Повтор текущего значения с актуальной версией — без изменений. Пересчитывает целочисленный прогресс и атомарно увеличивает версии чек-листа и этапа. Последний пункт непустого чек-листа автоматически переводит этап в acceptance. В rework мастер может менять только отмеченные для доработки пункты; повторное выполнение всех замечаний возвращает acceptance. Приёмка, completed и paid блокируют отметки; архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItem'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /file-uploads:
    post:
      operationId: createFileUpload
      tags:
        - Files
      summary: Создать upload-сессию
      description: Создаёт запись файла и возвращает короткоживущие подписанные данные для прямой загрузки в закрытое S3-совместимое хранилище. Лимит зависит от purpose — PDF проекта до 50 МБ, счёт PDF/JPEG до 10 МиБ (10485760 байт), фото JPEG/PNG/HEIC до 20 МБ. Превышение возвращает 413 file_too_large.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUpload'
      responses:
        '201':
          description: Upload-сессия создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '413':
          $ref: '#/components/responses/ApiPayloadTooLarge'
  /file-uploads/{uploadId}/completion:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: completeFileUpload
      tags:
        - Files
      summary: Подтвердить загрузку файла
      description: Проверяет объект в storage по MIME, фактическому размеру и SHA-256, повторно применяя лимит purpose. Для material_invoice предел равен 10485760 байт; лимиты project_document и checklist_photo не меняются. Повтор с тем же Idempotency-Key и телом возвращает тот же результат.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Уникальный ключ завершения загрузки.
          schema:
            type: string
            minLength: 16
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteFileUpload'
      responses:
        '200':
          description: Файл успешно загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
        '413':
          $ref: '#/components/responses/ApiPayloadTooLarge'
  /files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: getFileContent
      tags:
        - Files
      summary: Получить файл
      description: Проверяет доступ и возвращает короткоживущий подписанный URL. Постоянный storage URL не раскрывается.
      responses:
        '200':
          description: Подписанные данные скачивания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownload'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /checklist/items/{itemId}/photos:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: listChecklistItemPhotos
      tags:
        - Files
        - Checklists
      summary: Фотографии пункта чек-листа
      responses:
        '200':
          description: Активные фотографии по порядку.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChecklistItemPhoto'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    post:
      operationId: createChecklistItemPhoto
      tags:
        - Files
        - Checklists
      summary: Привязать загруженную фотографию
      description: Атомарно привязывает фотографию и проверяет лимит двадцать активных фото. Пункт автоматически не выполняется. Повтор привязки активного файла к тому же пункту возвращает ту же запись без изменений. Мастер на приёмке имеет только доступ для чтения; при доработке меняет только возвращённые пункты. completed и paid запрещают изменения для всех ролей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - fileId
              properties:
                fileId:
                  description: Идентификатор предварительно загруженного файла-фотографии.
                  examples:
                    - 301
                  $ref: '#/components/schemas/EntityId'
      responses:
        '201':
          description: Фотография привязана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemPhoto'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /checklist/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    delete:
      operationId: deleteChecklistItemPhoto
      tags:
        - Files
        - Checklists
      summary: Удалить фотографию пункта
      description: Помечает фото удалённым. Если это последнее активное фото выполненного пункта, требуется confirmLastPhotoDeletion=true, иначе 409 photo_deletion_confirmation_required. Подтверждённое удаление снимает выполнение и пересчитывает прогресс и версии в той же транзакции. Мастер на приёмке имеет только доступ для чтения; при доработке меняет только возвращённые пункты. completed и paid запрещают изменения для всех ролей.
      parameters:
        - name: confirmLastPhotoDeletion
          in: query
          schema:
            type: boolean
          description: Подтверждение снятия выполнения при удалении последнего фото.
      responses:
        '204':
          description: Фотография удалена.
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags:
        - Dashboard
      summary: Финансовая сводка панели руководителя
      description: |
        Только руководитель. Учитываются включённые этапы неархивных объектов, включая выплаченные. Работы и материалы включаются по plannedEndDate этапа не позже through; без даты окончания этап исключается. План работ и материалов берётся из ручных планов этапа. Факт включает выплаты и фактические оплаты счетов выбранных этапов с датой оплаты не позже through. Оплата не уменьшает план; остаток сохраняет переплату. Незаданный план выбранного этапа делает план категории и остаток неизвестными (null); нулевой план считается заданным.
      parameters:
        - name: through
          in: query
          required: false
          description: Конечная календарная дата включительно. По умолчанию сегодня в Asia/Yekaterinburg; допустим диапазон от сегодня до сегодня + 30 календарных дней включительно.
          schema:
            type: string
            format: date
          example: '2026-11-03'
      responses:
        '200':
          description: Агрегаты на применённую дату.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
  /dashboard/projects:
    get:
      operationId: listDashboardProjects
      tags:
        - Dashboard
      summary: Строки объектов панели руководителя
      description: Только руководитель. Загружается независимо от summary. Для активного объекта selectedStage — первый включённый по position этап со статусом не paid; все даты, мастер, суммы и индикаторы внутри selectedStage относятся только к нему. Завершённый объект возвращается с selectedStage=null. Сортировка по plannedStartDate выбранного этапа ASC NULLS LAST, затем projectId ASC; строки без начала и завершённые объекты идут в конце. Исключённые этапы не участвуют в финансах и выборе текущего этапа.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница компактных строк объектов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardProjectPage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
components:
  schemas:
    ExpectedVersion:
      type: integer
      minimum: 1
      examples:
        - 1
      description: Версия ресурса из последнего чтения. Обязательна при изменении финансовых и материальных ресурсов; несовпадение возвращает 409 version_conflict без частичного изменения.
    StageType:
      type: string
      enum:
        - foundation
        - walls
        - roof
        - windows
        - facade
        - electrical
        - finishing
        - heating
        - additional
      examples:
        - foundation
      description: foundation — Фундамент; walls — Стены; roof — Крыша; windows — Окна, двери; facade — Фасад; electrical — Электрика; finishing — Штукатурка; heating — Отопление; additional — Дополнительный этап.
    StageStatus:
      type: string
      enum:
        - created
        - assigned
        - supplied
        - in_progress
        - acceptance
        - rework
        - completed
        - paid
      examples:
        - in_progress
      description: Статус этапа в цепочке created → assigned → supplied → in_progress → acceptance → completed → paid. После приёмки paid рассчитывается автоматически при заданном плане работ и сумме выплат не меньше плана; появление долга возвращает completed. Работу можно начать из assigned; из acceptance возможен возврат в rework и повторный переход в acceptance.
    ApiErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - version_conflict
        - invalid_transition
        - idempotency_conflict
        - login_taken
        - last_manager
        - user_in_use
        - project_archived
        - unsupported_mime_type
        - file_too_large
        - checksum_mismatch
        - upload_incomplete
        - upload_expired
        - photo_limit_exceeded
        - photo_deletion_confirmation_required
        - invoice_limit_exceeded
        - rate_limited
      examples:
        - invalid_request
      description: Стабильный машинный код ошибки. Файловые коды различают MIME, размер, checksum, незавершённую и истёкшую upload-сессию.
    UserRole:
      examples:
        - foreman
      type: string
      enum:
        - manager
        - foreman
      description: manager — руководитель; foreman — мастер/исполнитель.
    User:
      description: Учётная запись сотрудника или исполнителя с ролью, контактами и признаком активности.
      type: object
      additionalProperties: false
      required:
        - id
        - login
        - fullName
        - role
        - phone
        - isActive
        - passwordResetRequestedAt
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 1
          description: Стабильный ID пользователя.
          type: integer
          minimum: 1
          maximum: 2147483647
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        passwordResetRequestedAt:
          examples:
            - '2026-10-04T08:00:00Z'
            - null
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
          description: Время открытого запроса сброса пароля; null означает отсутствие запроса. Руководитель закрывает запрос назначением нового пароля.
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
        isActive:
          examples:
            - true
          description: Признак активной учётной записи. Неактивный пользователь не может войти в систему.
          type: boolean
        createdAt:
          examples:
            - '2026-09-20T08:00:00Z'
          description: Дата и время создания записи в UTC, формат RFC 3339.
          type: string
          format: date-time
        updatedAt:
          examples:
            - '2026-09-24T10:00:00Z'
          description: Дата и время последнего изменения записи в UTC, формат RFC 3339.
          type: string
          format: date-time
    UserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          description: Пользователи текущей страницы с учётом фильтров и прав доступа.
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          examples:
            - 1
          description: Общее количество записей с учётом фильтров и прав доступа до применения limit и offset.
          type: integer
          minimum: 0
        limit:
          examples:
            - 20
          description: Применённый размер страницы; количество items может быть меньше.
          type: integer
          minimum: 1
          maximum: 100
        offset:
          examples:
            - 0
          description: Количество пропущенных записей после фильтрации и проверки доступа.
          type: integer
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - message
      properties:
        error:
          examples:
            - Bad Request
          description: Краткое название ошибки HTTP, соответствующее статусу ответа.
          type: string
          minLength: 1
          maxLength: 255
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          examples:
            - Плановое окончание не может быть раньше планового начала.
          description: Описание причины ошибки для человека.
          type: string
          minLength: 1
          maxLength: 2000
        details:
          description: Подробности ошибок отдельных полей запроса; могут отсутствовать.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                examples:
                  - body.plannedEndDate
                type: string
                minLength: 1
                maxLength: 255
                description: 'Путь к полю: body.plannedEndDate, query.limit и т. п.'
              message:
                examples:
                  - Плановое окончание не может быть раньше планового начала.
                description: Описание ошибки в поле запроса, указанном в path.
                type: string
                minLength: 1
                maxLength: 1000
    CreateUser:
      type: object
      additionalProperties: false
      required:
        - login
        - password
        - fullName
        - role
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
    UpdateUser:
      type: object
      additionalProperties: false
      properties:
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null очищает сохранённый телефон.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
        isActive:
          examples:
            - true
          description: Активность учётной записи. false деактивирует пользователя и отзывает его сессии; ограничения на последнего руководителя и действующие назначения проверяет сервер.
          type: boolean
      minProperties: 1
    SetUserPassword:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
    Session:
      type: object
      additionalProperties: false
      required:
        - expiresAt
        - user
      properties:
        expiresAt:
          examples:
            - '2026-09-24T20:00:00Z'
          description: Дата и время истечения сессии в UTC, формат RFC 3339. После истечения требуется новый вход.
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - login
      properties:
        login:
          example: foreman.ivan
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Логин пользователя, которому требуется новый пароль.
    ProjectStatus:
      type: string
      enum:
        - created
        - in_progress
        - acceptance
        - completed
      examples:
        - in_progress
      description: 'Вычисляемый статус проекта: created — работы фактически не начаты; in_progress — работы идут, включая доработку последнего этапа; acceptance — последний включённый этап принят или ожидает приёмки; completed — последний включённый этап выплачен.'
    PlannedMoneyAmountMinor:
      type:
        - integer
        - 'null'
      format: int64
      minimum: 0
      multipleOf: 100
      examples:
        - 12500000
        - 0
        - null
      description: 'Плановая сумма в копейках: null — план не задан; 0 — задан нулевой план. В первой версии ненулевое значение кратно 100.'
    MoneyAmountMinor:
      type: integer
      format: int64
      minimum: 0
      examples:
        - 12500000
      description: Неотрицательная денежная сумма в копейках.
    VariancePercent:
      type:
        - number
        - 'null'
      examples:
        - 10
        - -10
        - null
      description: Отклонение (план − факт) / план × 100. Плюс — экономия, минус — перерасход; null — план отсутствует, равен нулю или неполон.
    ProjectFinancialSummary:
      type: object
      additionalProperties: false
      required:
        - plannedWorkAmountMinor
        - actualWorkAmountMinor
        - plannedMaterialAmountMinor
        - actualMaterialAmountMinor
        - totalPlannedAmountMinor
        - totalActualAmountMinor
        - isPlanComplete
        - variancePercent
      properties:
        plannedWorkAmountMinor:
          readOnly: true
          description: Сумма планов работ включённых в расчёт этапов; null при неполном плане.
          allOf:
            - $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        actualWorkAmountMinor:
          readOnly: true
          description: Сумма платежей за работы включённых в расчёт этапов.
          allOf:
            - $ref: '#/components/schemas/MoneyAmountMinor'
        plannedMaterialAmountMinor:
          readOnly: true
          description: Сумма планов материалов включённых в расчёт этапов; null при неполном плане.
          allOf:
            - $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        actualMaterialAmountMinor:
          readOnly: true
          description: Сумма оплаченных счетов за материалы включённых в расчёт этапов.
          allOf:
            - $ref: '#/components/schemas/MoneyAmountMinor'
        totalPlannedAmountMinor:
          readOnly: true
          description: Общий план проекта по работам и материалам; null при неполном плане.
          allOf:
            - $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        totalActualAmountMinor:
          readOnly: true
          description: Общие фактические затраты проекта на работы и материалы.
          allOf:
            - $ref: '#/components/schemas/MoneyAmountMinor'
        isPlanComplete:
          type: boolean
          readOnly: true
          examples:
            - false
          description: true, если планы работ и материалов заданы у всех включённых в расчёт этапов. Нулевые планы считаются заданными.
        variancePercent:
          readOnly: true
          description: Процент отклонения общего плана проекта от общего факта.
          allOf:
            - $ref: '#/components/schemas/VariancePercent'
      description: Вычисляемые финансовые итоги проекта. Все поля доступны только для чтения; при неполном плане плановые итоги и отклонение равны null.
    Coordinates:
      type: object
      additionalProperties: false
      description: Географические координаты объекта в десятичных градусах.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          examples:
            - 56.8389
          description: Географическая широта в десятичных градусах, от −90 до 90.
          type: number
          minimum: -90
          maximum: 90
        longitude:
          examples:
            - 60.6057
          description: Географическая долгота в десятичных градусах, от −180 до 180.
          type: number
          minimum: -180
          maximum: 180
    Project:
      description: Реквизиты, версия и вычисленные итоги объекта.
      type: object
      additionalProperties: false
      required:
        - id
        - ownerName
        - address
        - coordinates
        - cadastralNumber
        - houseDesign
        - contractLabel
        - plannedStartDate
        - plannedEndDate
        - notes
        - isArchived
        - version
        - status
        - finances
        - documentFileIds
        - createdAt
        - updatedAt
      properties:
        version:
          $ref: '#/components/schemas/ExpectedVersion'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        finances:
