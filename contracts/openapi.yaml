openapi: 3.1.0
info:
  title: Stageby API
  version: 0.1.0
  description: 'Контракт первой версии управления строительством: пользователи, проекты, этапы и чек-листы. Финансовый модуль, фото, материалы, инструмент и платежи отложены. Реализация новых маршрутов выполняется отдельно. ID новых сущностей — положительные целые числа int32, назначаемые БД автоматически. Даты работ YYYY-MM-DD; timestamps — RFC 3339 UTC. Календарный часовой пояс первой версии Asia/Yekaterinburg. PATCH меняет только переданные поля, null очищает только nullable-поле, пустое тело запрещено; массив заменяется целиком. Все изменения атомарны. Неизвестные поля и query-параметры — 400. Непустые текстовые значения обрезаются по краям и не могут состоять только из пробелов; пароли не обрезаются. Политики доступа обязательны на сервере, включая списки, total и вложенные записи. Документ описывает целевой API.'
servers:
  - url: /
    description: Тот же origin, с которого загружены API-документация или клиент.
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Логин, пароль и сессии. Первого руководителя создаёт административная команда при развёртывании, публичной регистрации нет.
  - name: Users
    description: Сотрудники и исполнители. Управление только руководителем.
  - name: Projects
    description: Объекты строительства и данные клиента.
  - name: Stages
    description: Фиксированные виды работ, назначения, зависимости и приёмка.
  - name: Checklists
    description: Один чек-лист с контрольными точками на этап. В текущей версии без фото.
paths:
  /users:
    get:
      operationId: listUsers
      tags:
        - Users
      summary: Список пользователей
      description: Только руководитель. Сортировка fullName ASC, id ASC. По умолчанию активные и неактивные. Фильтры объединяются через AND.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: role
          in: query
          required: false
          description: Точная роль.
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: isActive
          in: query
          required: false
          description: Активность.
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Поиск подстроки в имени или логине без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
    post:
      operationId: createUser
      tags:
        - Users
      summary: Создать учётную запись
      description: Только руководитель. Новая запись активна. Логин уникален среди всех записей, включая неактивные; дубликат — 409 login_taken. Самостоятельной регистрации нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getUser
      tags:
        - Users
      summary: Карточка пользователя
      description: Только руководитель. Остальные получают свой профиль через /auth/me.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateUser
      tags:
        - Users
      summary: Изменить пользователя
      description: 'Только руководитель. Деактивация и изменение роли отзывают все сессии пользователя. Нельзя лишить систему последнего активного manager (409 last_manager). Нельзя деактивировать или сменить роль назначенного мастера/приёмщика незавершённого этапа: сначала переназначьте этап (409 user_in_use). Удаления нет; история сохраняется.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /users/{userId}/password:
    parameters:
      - name: userId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    put:
      operationId: setUserPassword
      tags:
        - Users
      summary: Установить пароль пользователя
      description: Только руководитель. Заменяет пароль и отзывает все сессии целевого пользователя, включая текущую, если он меняет собственный пароль. Следующий запрос требует повторного входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPassword'
      responses:
        '204':
          description: Операция выполнена; тело отсутствует.
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Войти по логину и паролю
      description: 'Публичный вход. Сервер устанавливает защищённую HttpOnly cookie stageby_session, которая действует до expiresAt (максимум 12 часов) либо отзыва. После истечения нужен повторный вход. Обязателен лимит попыток по IP и логину. Ответ не кэшируется (Cache-Control: no-store).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Cache-Control:
              description: Токены не кэшируются.
              schema:
                type: string
                enum:
                  - no-store
            Set-Cookie:
              description: Защищённая HttpOnly cookie с идентификатором серверной сессии.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/ApiTooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Завершить текущую сессию
      description: Отзывает предъявленную через cookie сессию и удаляет cookie в браузере. При последующих запросах возвращается 401.
      responses:
        '204':
          description: Операция выполнена; тело отсутствует.
          headers:
            Set-Cookie:
              description: Удаляет cookie stageby_session.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Получить свой профиль
      description: Профиль текущего активного пользователя, без пароля или его хеша.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
  /projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: Список объектов строительства
      description: Руководитель и инженер-сметчик. Мастер и приёмщик работают через /stages без доступа к полной карточке клиента. Сортировка createdAt DESC, id ASC. Фильтры AND.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: isArchived
          in: query
          required: false
          description: По умолчанию только активные проекты.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          description: Подстрока названия, имени клиента, адреса или кадастрового номера без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Составное создание объекта
      description: Только руководитель. В одной транзакции создаёт проект, выбранные этапы и индивидуальные чек-листы. Если checklistItems этапа отсутствует, сервер копирует активный шаблон его типа. Ошибка любого этапа откатывает всю операцию. Защита интерфейса от повторной отправки будет реализована на фронтенде. Идентификаторы файлов относятся к предварительно успешно загруженным PDF проекта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Карточка проекта
      description: Руководитель и инженер-сметчик. Финансы выдаются отдельным методом.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateProject
      tags:
        - Projects
      summary: Изменить или архивировать проект
      description: Только руководитель. Архивирование не удаляет историю, делает этапы и чек-листы проекта доступными только для чтения. Разархивирование — isArchived=false. Физического удаления проекта и фиксированных этапов нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /stages:
    get:
      operationId: listStages
      tags:
        - Stages
      summary: Список доступных этапов
      description: Руководитель видит все этапы; мастер — только где assigneeId равен его ID. Фильтры AND применяются после ограничения доступа, total не раскрывает чужие записи. По умолчанию без архивных проектов. Сортировка projectId ASC, position ASC, id ASC.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: projectId
          in: query
          required: false
          description: Фильтр проекта.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: assigneeId
          in: query
          required: false
          description: Фильтр мастера; не расширяет доступ.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          description: Рабочий статус.
          schema:
            $ref: '#/components/schemas/StageStatus'
        - name: includeArchived
          in: query
          required: false
          description: Включить этапы архивных проектов.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
  /projects/{projectId}/stages:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: listProjectStages
      tags:
        - Stages
      summary: Этапы одного проекта
      description: 'Без пагинации: максимум восемь записей, position ASC. Руководитель видит все восемь; мастер — только назначенные ему. Для существующего проекта вне области доступа возвращается 404.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStages'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /stages/{stageId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getStage
      tags:
        - Stages
      summary: Карточка этапа
      description: Доступ как у /stages. Карточка содержит адрес и координаты для выезда, но не имя клиента и договор. latestAcceptance хранит последнее решение, не журнал всех проверок.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateStage
      tags:
        - Stages
      summary: Настроить этап
      description: Руководитель меняет все входные поля. Назначенный мастер — только notes. Назначать можно только активного foreman. Первое назначение автоматически переводит created в assigned; снятие допускается только из assigned и возвращает created. В supplied/in_progress/acceptance/rework мастер обязателен, допускается его замена руководителем. completed и paid неизменяемы. После начала работ зависимости не меняются. Плановое окончание не раньше начала, сравнивается результирующая запись после PATCH. Предшественники — этапы того же проекта, без себя и циклов; проверка графа и запись выполняются атомарно. Удаление назначенного приёмщика во время acceptance запрещено. Архив — 409 project_archived. Передача запрещённого роли поля — 403, весь запрос отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/status:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    put:
      operationId: changeStageStatus
      tags:
        - Stages
      summary: Перевести этап в следующий рабочий статус
      description: Только руководитель. Явно разрешены assigned→supplied при наличии хотя бы одного заказа, хотя бы одного счёта в каждом заказе и доставке всех счетов, а также completed→paid при нулевом остатке по работам. Старт, переход на приёмку и возврат с доработки выполняются автоматически изменением пунктов. Повтор текущего статуса с актуальной версией возвращает запись без изменения. Остальные переходы — 409 invalid_transition. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStageStatus'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/acceptance:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: acceptStage
      tags:
        - Stages
      summary: Принять этап
      description: Только руководитель. Только из acceptance, при всех выполненных пунктах. Атомарно записывает latestAcceptance с decision=accepted, текущим пользователем, временем и correctionDueDate=null; переводит этап в completed и устанавливает actualEndDate. Это электронная отметка приёмки, не PDF и не юридически значимая подпись. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/rework:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: returnStageForRework
      tags:
        - Stages
      summary: Вернуть этап на доработку
      description: Только руководитель. Только из acceptance. Замечание, дата исправления и itemIds обязательны; дата не раньше текущей даты объекта. Интерфейс может предложить сегодня + 2 календарных дня, сервер не угадывает срок. Все itemIds должны принадлежать этому чек-листу, иначе 400 invalid_request. Переводит в rework, пишет latestAcceptance с decision=rejected и сбрасывает только указанные пункты для повторной проверки (completedAt/completedBy=null), остальные отметки сохраняет. Увеличивает версии этапа и чек-листа атомарно. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/checklist:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getStageChecklist
      tags:
        - Checklists
      summary: Чек-лист этапа
      description: Один чек-лист на этап, создаётся вместе с проектом. Руководитель видит любой чек-лист, мастер — только чек-лист назначенного ему этапа.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    put:
      operationId: configureStageChecklist
      tags:
        - Checklists
      summary: Настроить контрольные точки
      description: 'Только руководитель. Только до старта: created, assigned или supplied. Атомарно заменяет весь состав на непустой список. Создаёт новые ID пунктов, все отметки false, position начинается с 1; увеличивает версии чек-листа и этапа. expectedVersion относится к чек-листу. После старта состав фиксирован. Архив — 409 project_archived. Названия не должны состоять из пробелов.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureChecklist'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /stages/{stageId}/checklist/items/{itemId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: itemId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    patch:
      operationId: updateChecklistItem
      tags:
        - Checklists
      summary: Отметить или снять выполнение пункта
      description: Руководитель или назначенный мастер. Первый явно выполненный пункт начинает этап из assigned или supplied, устанавливает actualStartDate и возвращает предупреждение materials_incomplete при старте из assigned. Для isCompleted=true нужна хотя бы одна успешно загруженная активная фотография. Сама загрузка фотографии пункт не выполняет. itemId должен принадлежать чек-листу данного этапа, иначе 404. expectedVersion — версия всего чек-листа. false→true устанавливает completedAt и completedBy на сервере; true→false очищает их. Повтор текущего значения с актуальной версией — без изменений. Пересчитывает целочисленный прогресс и атомарно увеличивает версии чек-листа и этапа. Последний пункт непустого чек-листа автоматически переводит этап в acceptance. В rework мастер может менять только отмеченные для доработки пункты; повторное выполнение всех замечаний возвращает acceptance. Приёмка, completed и paid блокируют отметки; архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItem'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
components:
  schemas:
    ExpectedVersion:
      type: integer
      minimum: 1
      examples:
        - 1
      description: Версия ресурса из последнего чтения. Обязательна при изменении финансовых и материальных ресурсов; несовпадение возвращает 409 version_conflict без частичного изменения.
    StageType:
      type: string
      enum:
        - foundation
        - walls
        - roof
        - windows
        - facade
        - electrical
        - finishing
        - heating
      examples:
        - foundation
      description: foundation — Фундамент; walls — Стены; roof — Крыша; windows — Окна; facade — Фасад; electrical — Электрика; finishing — Отделка; heating — Отопление.
    StageStatus:
      type: string
      enum:
        - created
        - assigned
        - supplied
        - in_progress
        - acceptance
        - rework
        - completed
        - paid
      examples:
        - in_progress
      description: Статус этапа в цепочке created → assigned → supplied → in_progress → acceptance → completed → paid. Работу можно начать из assigned; из acceptance возможен возврат в rework и повторный переход в acceptance.
    ApiErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - version_conflict
        - invalid_transition
        - idempotency_conflict
        - login_taken
        - last_manager
        - user_in_use
        - project_archived
        - unsupported_mime_type
        - file_too_large
        - checksum_mismatch
        - upload_incomplete
        - upload_expired
        - photo_limit_exceeded
        - rate_limited
      examples:
        - invalid_request
      description: Стабильный машинный код ошибки. Файловые коды различают MIME, размер, checksum, незавершённую и истёкшую upload-сессию.
    UserRole:
      examples:
        - foreman
      type: string
      enum:
        - manager
        - estimator
        - foreman
        - inspector
      description: manager — руководитель; estimator — инженер-сметчик; foreman — мастер/исполнитель; inspector — приёмщик.
    User:
      description: Учётная запись сотрудника или исполнителя с ролью, контактами и признаком активности.
      type: object
      additionalProperties: false
      required:
        - id
        - login
        - fullName
        - role
        - phone
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 1
          description: Стабильный ID пользователя.
          type: integer
          minimum: 1
          maximum: 2147483647
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
        isActive:
          examples:
            - true
          description: Признак активной учётной записи. Неактивный пользователь не может войти в систему.
          type: boolean
        createdAt:
          examples:
            - '2026-09-20T08:00:00Z'
          description: Дата и время создания записи в UTC, формат RFC 3339.
          type: string
          format: date-time
        updatedAt:
          examples:
            - '2026-09-24T10:00:00Z'
          description: Дата и время последнего изменения записи в UTC, формат RFC 3339.
          type: string
          format: date-time
    UserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          description: Пользователи текущей страницы с учётом фильтров и прав доступа.
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          examples:
            - 1
          description: Общее количество записей с учётом фильтров и прав доступа до применения limit и offset.
          type: integer
          minimum: 0
        limit:
          examples:
            - 20
          description: Применённый размер страницы; количество items может быть меньше.
          type: integer
          minimum: 1
          maximum: 100
        offset:
          examples:
            - 0
          description: Количество пропущенных записей после фильтрации и проверки доступа.
          type: integer
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - message
      properties:
        error:
          examples:
            - Bad Request
          description: Краткое название ошибки HTTP, соответствующее статусу ответа.
          type: string
          minLength: 1
          maxLength: 255
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          examples:
            - Плановое окончание не может быть раньше планового начала.
          description: Описание причины ошибки для человека.
          type: string
          minLength: 1
          maxLength: 2000
        details:
          description: Подробности ошибок отдельных полей запроса; могут отсутствовать.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                examples:
                  - body.plannedEndDate
                type: string
                minLength: 1
                maxLength: 255
                description: 'Путь к полю: body.plannedEndDate, query.limit и т. п.'
              message:
                examples:
                  - Плановое окончание не может быть раньше планового начала.
                description: Описание ошибки в поле запроса, указанном в path.
                type: string
                minLength: 1
                maxLength: 1000
    CreateUser:
      type: object
      additionalProperties: false
      required:
        - login
        - password
        - fullName
        - role
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
    UpdateUser:
      type: object
      additionalProperties: false
      properties:
        fullName:
          examples:
            - Иван Петров
          description: Полное имя сотрудника или исполнителя для отображения.
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          examples:
            - +7 900 000-00-00
            - null
          description: Контактный телефон пользователя; null очищает сохранённый телефон.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
        isActive:
          examples:
            - true
          description: Активность учётной записи. false деактивирует пользователя и отзывает его сессии; ограничения на последнего руководителя и действующие назначения проверяет сервер.
          type: boolean
      minProperties: 1
    SetUserPassword:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          description: Уникальный логин в нижнем регистре. Не email и не телефон. Не изменяется после создания.
          examples:
            - foreman.ivan
        password:
          examples:
            - Example-Only-Password-123!
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Пароль не возвращается в ответах и не записывается в логи. На сервере хранится только стойкий хеш.
    Session:
      type: object
      additionalProperties: false
      required:
        - expiresAt
        - user
      properties:
        expiresAt:
          examples:
            - '2026-09-24T20:00:00Z'
          description: Дата и время истечения сессии в UTC, формат RFC 3339. После истечения требуется новый вход.
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    Coordinates:
      type: object
      additionalProperties: false
      description: Географические координаты объекта в десятичных градусах.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          examples:
            - 56.8389
          description: Географическая широта в десятичных градусах, от −90 до 90.
          type: number
          minimum: -90
          maximum: 90
        longitude:
          examples:
            - 60.6057
          description: Географическая долгота в десятичных градусах, от −180 до 180.
          type: number
          minimum: -180
          maximum: 180
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerName
        - address
        - coordinates
        - cadastralNumber
        - houseDesign
        - contractLabel
        - plannedStartDate
        - plannedEndDate
        - notes
        - isArchived
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 101
          description: Стабильный ID проекта — объекта строительства.
          type: integer
          minimum: 1
          maximum: 2147483647
        ownerName:
          examples:
            - Анна Смирнова
          description: Имя клиента или собственника объекта строительства.
          type: string
          minLength: 1
          maxLength: 255
        address:
          examples:
            - Екатеринбург, ул. Лесная, д. 10
          description: Обязательный адрес объекта строительства.
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: Обязательные географические координаты объекта для отображения на карте.
          $ref: '#/components/schemas/Coordinates'
        cadastralNumber:
          examples:
            - '66:41:0000000:123'
            - null
          description: Кадастровый номер объекта в текстовом виде; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - Семья 67
            - null
          description: Название варианта дома, например «Семья 67»; null — не указан.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - Договор по объекту «Дом на Лесной»
            - null
          description: Текстовый реквизит «договор» из исходной ведомости; null — не указан. Не является идентификатором пользователя.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - '2026-10-05'
          description: Плановая дата начала проекта в формате YYYY-MM-DD.
          type: string
          format: date
        plannedEndDate:
          examples:
            - '2027-05-28'
          description: Плановая дата окончания проекта в формате YYYY-MM-DD, не раньше даты начала.
          type: string
          format: date
        notes:
          examples:
            - Въезд на участок со стороны Лесной улицы.
            - null
          description: Примечания к проекту; null — отсутствуют.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 5000
        isArchived:
          examples:
            - false
          description: Признак архивного проекта. Архивный проект и его этапы доступны только для чтения.
          type: boolean
        createdAt:
          examples:
            - '2026-09-20T08:00:00Z'
          description: Дата и время создания записи в UTC, формат RFC 3339.
          type: string
          format: date-time
        updatedAt:
          examples:
            - '2026-09-24T10:00:00Z'
          description: Дата и время последнего изменения записи в UTC, формат RFC 3339.
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          description: Проекты текущей страницы с учётом фильтров и прав доступа.
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          examples:
            - 1
          description: Общее количество записей с учётом фильтров и прав доступа до применения limit и offset.
          type: integer
          minimum: 0
        limit:
          examples:
            - 20
          description: Применённый размер страницы; количество items может быть меньше.
          type: integer
          minimum: 1
          maximum: 100
        offset:
          examples:
            - 0
          description: Количество пропущенных записей после фильтрации и проверки доступа.
          type: integer
          minimum: 0
    PlannedMoneyAmountMinor:
      type:
        - integer
        - 'null'
      format: int64
      minimum: 0
      multipleOf: 100
      examples:
        - 12500000
        - 0
        - null
      description: 'Плановая сумма в копейках: null — план не задан; 0 — задан нулевой план. В первой версии ненулевое значение кратно 100.'
    CreateProjectChecklistItem:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          examples:
            - Армирование
          description: Название индивидуального пункта чек-листа.
          type: string
          minLength: 1
          maxLength: 500
        photoHint:
          examples:
            - Фото перевязки углов и перехлёста арматуры
            - null
          description: Необязательная подсказка о том, что должно быть видно на фотографии.
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 1000
    CreateProjectStage:
      type: object
      additionalProperties: false
      required:
        - type
        - plannedStartDate
        - plannedEndDate
        - canRunInParallel
        - assigneeId
        - plannedWorkAmountMinor
        - plannedMaterialAmountMinor
      properties:
        type:
          $ref: '#/components/schemas/StageType'
        plannedStartDate:
          examples:
            - '2026-10-05'
          type: string
          format: date
          description: Плановое начало этапа внутри срока проекта.
        plannedEndDate:
          examples:
            - '2026-10-30'
          type: string
          format: date
          description: Плановое окончание этапа внутри срока проекта, не раньше начала этапа.
        canRunInParallel:
          examples:
            - false
          type: boolean
          description: Может ли этап выполняться параллельно с соседними этапами.
        assigneeId:
          examples:
            - 17
            - null
          description: Активный мастер этапа; null — мастер пока не назначен.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 2147483647
        plannedWorkAmountMinor:
          $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        plannedMaterialAmountMinor:
          $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        checklistItems:
          description: Изменённый индивидуальный список. Если поле отсутствует, копируется активный шаблон типа этапа.
          type: array
