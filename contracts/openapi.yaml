      type: object
      additionalProperties: false
      required:
        - through
        - activeProjectCount
        - works
        - materials
        - total
      properties:
        through:
          type: string
          format: date
          readOnly: true
          description: Применённая календарная дата в Asia/Yekaterinburg.
          example: '2026-11-03'
        activeProjectCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Количество неархивных объектов, у которых хотя бы один включённый этап не paid; от through не зависит.
          example: 7
        works:
          $ref: '#/components/schemas/DashboardMoneyMetric'
        materials:
          $ref: '#/components/schemas/DashboardMoneyMetric'
        total:
          description: Общий итог работ и материалов. План и остаток равны null, если неполон план хотя бы одной категории.
          allOf:
            - $ref: '#/components/schemas/DashboardMoneyMetric'
