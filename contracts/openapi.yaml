  /stages/{stageId}/material-invoices:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      operationId: listStageMaterialInvoices
      tags:
        - Materials
      summary: Счета материалов этапа
      description: Руководитель видит счета любого этапа, мастер — только назначенного ему. Сортировка createdAt ASC, id ASC. Заказ материалов пользователем не создаётся.
      responses:
        '200':
          description: До десяти счетов этапа со сведениями об оплате, доставке и нехватках.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/StageMaterialInvoice'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    post:
      operationId: createStageMaterialInvoice
      tags:
        - Materials
      summary: Добавить счёт материалов к этапу
      description: Только руководитель. Привязывает к существующему этапу успешно загруженный PDF или JPEG назначения material_invoice размером не более 10 МиБ и положительную сумму. Один fileId можно привязать не более одного раза. Лимит десять счетов проверяется атомарно под блокировкой этапа; при двух конкурентных запросах на десятое место ровно один может завершиться успешно, второй получает 409 invoice_limit_exceeded. Повтор с тем же fileId, этапом, суммой и поставщиком возвращает прежний счёт (201), даже при заполненном лимите, без нового события аудита. Изменённые данные или другой этап для уже привязанного файла возвращают 400 invalid_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialInvoice'
      responses:
        '201':
          description: Счёт создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageMaterialInvoice'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/InvoiceConflict'
        '413':
          $ref: '#/components/responses/ApiPayloadTooLarge'
  /material-invoices/{invoiceId}:
