    DashboardMoneyMetric:
      type: object
      description: План, факт, остаток и полнота плана одной финансовой категории.
      additionalProperties: false
      required:
        - plannedAmountMinor
        - actualAmountMinor
        - balanceAmountMinor
        - isPlanComplete
      properties:
        plannedAmountMinor:
          readOnly: true
          description: Сумма планов обязательств в расчёте; null при неполноте категории. Для работ и материалов используются ручные планы этапов. Обязательства вне расчёта не влияют на полноту; пустой периметр даёт 0.
          allOf:
            - $ref: '#/components/schemas/PlannedMoneyAmountMinor'
        actualAmountMinor:
          readOnly: true
          description: Фактическая сумма оплат с датой не позже through по тем же этапам, которые вошли в расчёт плана.
          allOf:
            - $ref: '#/components/schemas/MoneyAmountMinor'
        balanceAmountMinor:
          readOnly: true
          description: План минус факт; отрицательное значение означает переплату, null — план неполон.
          allOf:
            - $ref: '#/components/schemas/SignedMoneyAmountMinor'
        isPlanComplete:
          type: boolean
          readOnly: true
          example: true
          description: true, если план категории полон в выбранном периметре. Неполнота означает незаданный ручной план категории у выбранного этапа. Нулевой план считается заданным.
