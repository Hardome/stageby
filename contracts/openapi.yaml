openapi: 3.1.0
info:
  title: Stageby API
  version: 0.1.0
  description: 'Контракт первой версии управления строительством: пользователи, проекты, этапы, чек-листы, файлы, оплата работ и материалы. Инструмент и остальные финансовые операции отложены. ID новых сущностей — положительные целые числа int32, назначаемые БД автоматически. Даты работ YYYY-MM-DD; timestamps — RFC 3339 UTC. Календарный часовой пояс первой версии Asia/Yekaterinburg. PATCH меняет только переданные поля, null очищает только nullable-поле, пустое тело запрещено; массив заменяется целиком. Все изменения атомарны. Неизвестные поля и query-параметры — 400. Непустые текстовые значения обрезаются по краям и не могут состоять только из пробелов; пароли не обрезаются. Политики доступа обязательны на сервере, включая списки, total и вложенные записи. Документ описывает целевой API.'
servers:
  - url: /
    description: Тот же origin, с которого загружены API-документация или клиент.
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Логин, пароль и сессии. Первого руководителя создаёт административная команда при развёртывании, публичной регистрации нет.
  - name: Users
    description: Сотрудники и исполнители. Управление только руководителем.
  - name: Projects
    description: Объекты строительства и данные клиента.
  - name: Stages
    description: Фиксированные виды работ, назначения, зависимости и приёмка.
  - name: Checklists
    description: Один чек-лист с контрольными точками и фотографиями на этап.
  - name: Work payments
    description: Фактические платежи за выполненные работы этапа. Изменение доступно только руководителю.
  - name: Files
    description: Устойчивые upload-сессии, закрытое файловое хранилище и типизированные связи файлов.
  - name: Materials
    description: Счета этапа, независимые отметки оплаты и доставки и сообщения о нехватке.
  - name: Dashboard
    description: Независимые агрегаты и строки панели руководителя.
paths:
  /users:
    get:
      operationId: listUsers
      tags:
        - Users
      summary: Список пользователей
      description: Только руководитель. Сортировка fullName ASC, id ASC. По умолчанию активные и неактивные. Фильтры объединяются через AND.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: role
          in: query
          required: false
          description: Точная роль.
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: isActive
          in: query
          required: false
          description: Активность.
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Поиск подстроки в имени или логине без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
    post:
      operationId: createUser
      tags:
        - Users
      summary: Создать учётную запись
      description: Только руководитель. Новая запись активна. Логин уникален среди всех записей, включая неактивные; дубликат — 409 login_taken. Самостоятельной регистрации нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getUser
      tags:
        - Users
      summary: Карточка пользователя
      description: Только руководитель. Остальные получают свой профиль через /auth/me.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateUser
      tags:
        - Users
      summary: Изменить пользователя
      description: 'Только руководитель. Деактивация и изменение роли отзывают все сессии пользователя. Нельзя лишить систему последнего активного manager (409 last_manager). Нельзя деактивировать или сменить роль назначенного мастера незавершённого этапа: сначала переназначьте этап (409 user_in_use). Удаления нет; история сохраняется.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /users/{userId}/password:
    parameters:
      - name: userId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    put:
      operationId: setUserPassword
      tags:
        - Users
      summary: Установить пароль пользователя
      description: Только руководитель. Заменяет пароль и отзывает все сессии целевого пользователя, включая текущую, если он меняет собственный пароль. Следующий запрос требует повторного входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPassword'
      responses:
        '204':
          description: Операция выполнена; тело отсутствует.
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Войти по логину и паролю
      description: 'Публичный вход. Сервер устанавливает защищённую HttpOnly cookie stageby_session, которая действует до expiresAt (максимум 12 часов) либо отзыва. После истечения нужен повторный вход. Обязателен лимит попыток по IP и логину. Ответ не кэшируется (Cache-Control: no-store).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Cache-Control:
              description: Токены не кэшируются.
              schema:
                type: string
                enum:
                  - no-store
            Set-Cookie:
              description: Защищённая HttpOnly cookie с идентификатором серверной сессии.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/ApiTooManyRequests'
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags:
        - Auth
      summary: Запросить назначение нового пароля
      description: Публичный запрос по логину. Ответ одинаков для существующего, неизвестного и неактивного пользователя. Руководитель видит отметку в списке пользователей и закрывает запрос назначением нового пароля. Повтор открытого запроса не создаёт дубля. Применяется лимит запросов по IP и логину.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Запрос принят; тело отсутствует, наличие пользователя не раскрывается.
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '429':
          $ref: '#/components/responses/ApiTooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Завершить текущую сессию
      description: Отзывает предъявленную через cookie сессию и удаляет cookie в браузере. При последующих запросах возвращается 401.
      responses:
        '204':
          description: Операция выполнена; тело отсутствует.
          headers:
            Set-Cookie:
              description: Удаляет cookie stageby_session.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Получить свой профиль
      description: Профиль текущего активного пользователя, без пароля или его хеша.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
  /projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: Список объектов строительства
      description: Только руководитель. Мастер работает через /stages без доступа к полной карточке объекта и общим суммам. Сортировка createdAt DESC, id ASC. Фильтры AND.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: isArchived
          in: query
          required: false
          description: По умолчанию только активные проекты.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          description: Подстрока названия, имени клиента, адреса или кадастрового номера без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Составное создание объекта
      description: Только руководитель. В одной транзакции создаёт проект, выбранные этапы и индивидуальные чек-листы. Если checklistItems этапа отсутствует, сервер копирует активный шаблон его типа. Ошибка любого этапа откатывает всю операцию. Счета материалов в этот запрос не входят и добавляются отдельно к уже созданному этапу. Идентификаторы файлов относятся только к предварительно успешно загруженным PDF проекта. Повтор с тем же Idempotency-Key и тем же телом возвращает ранее созданный объект; тот же ключ с другим телом возвращает 409 idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Карточка проекта
      description: Только руководитель. Мастер получает только назначенные ему этапы через /stages.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateProject
      tags:
        - Projects
      summary: Изменить или архивировать проект
      description: Только руководитель. Атомарно сохраняет реквизиты, документы, этапы, чек-листы и дополнительный этап. Проверяет версии и итоговое состояние формы. Пропущенные поля и этапы сохраняются; null очищает nullable-поле. Исключение явно задаётся isIncluded=false, разрешено до фактического старта и без фото (включая удалённые), счетов и выплат. Восстановление сохраняет ID и историю. Минимум один включённый этап обязателен. Архивный объект допускает только отдельное разархивирование isArchived=false. Общие планы объекта не редактируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
        '409':
          $ref: '#/components/responses/ApiConflict'
  /projects/{projectId}/edit:
    get:
      operationId: getProjectEdit
      tags:
        - Projects
      summary: Загрузить форму редактирования объекта
      description: Только руководитель. Согласованный снимок реквизитов, документов, всех этапов (включая исключённые), чек-листов и версий.
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID объекта.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Данные формы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEdit'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /stage-types:
    get:
      operationId: listActiveStageTypes
      tags:
        - Stages
      summary: Активные типы этапов и шаблоны
      description: Только руководитель. Возвращает активный справочник в порядке position ASC и ровно тот активный шаблон каждого типа, который сервер копирует при создании объекта, включая photoHint. Ответ не содержит неактивные редакции.
      responses:
        '200':
          description: Активные типы этапов с шаблонами чек-листов.
          content:
            application/json:
              schema:
                type: array
                maxItems: 9
                items:
                  $ref: '#/components/schemas/ActiveStageType'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
  /stages:
    get:
      operationId: listStages
      tags:
        - Stages
      summary: Список доступных этапов
      description: Руководитель видит все этапы; мастер — только где assigneeId равен его ID. Фильтры AND применяются после ограничения доступа, total не раскрывает чужие записи. По умолчанию без архивных проектов. Сортировка projectId ASC, position ASC, id ASC.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: projectId
          in: query
          required: false
          description: Фильтр проекта.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: assigneeId
          in: query
          required: false
          description: Фильтр мастера; не расширяет доступ.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          description: Рабочий статус.
          schema:
            $ref: '#/components/schemas/StageStatus'
        - name: includeArchived
          in: query
          required: false
          description: Включить этапы архивных проектов.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
  /projects/{projectId}/stages:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: listProjectStages
      tags:
        - Stages
      summary: Этапы одного проекта
      description: 'Без пагинации: максимум девять записей, position ASC. Руководитель видит включённые этапы; мастер — только назначенные ему. Для существующего проекта вне области доступа возвращается 404.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStages'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
  /stages/{stageId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getStage
      tags:
        - Stages
      summary: Карточка этапа
      description: Доступ как у /stages. Карточка содержит клиента, адрес, координаты, границы дат и ID PDF проекта, телефон мастера и номер среди всех включённых этапов. Контекст доступен назначенному мастеру без getProject; PDF открывается через getFileContent. latestAcceptance хранит последнее решение, не журнал всех проверок.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/ApiBadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/ApiNotFound'
    patch:
      operationId: updateStage
      tags:
        - Stages
      summary: Настроить этап
      description: Только руководитель. Можно передать любое непустое сочетание полей; все проверки выполняются по результирующей записи, изменения атомарны и увеличивают version один раз. Назначать можно только активного foreman; null снимает назначение. Даты, мастер и ручные планы редактируются после старта, включая completed и paid; фактические даты сохраняются. После приёмки статус автоматически становится paid при заданном плане и сумме выплат не меньше плана, иначе completed. Финансовые исправления могут вернуть paid в completed. Даты независимо nullable; каждая заданная дата находится внутри обеих границ проекта, окончание не раньше начала при наличии обеих дат; соседние этапы не переносятся. Устаревшая expectedVersion — 409 version_conflict, архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStage'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
