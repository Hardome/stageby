extends:
  - recommended

apis:
  stageby:
    root: ./references/stageby/stageby.yaml
    output: ./openapi.yaml

rules:
  # У внутреннего API пока нет опубликованной лицензии.
  info-license: off
  # GET /todos не принимает параметры и не объявляет прикладных ошибок 4xx.
  operation-4xx-response: off
  no-unused-components: error
  scalar-property-missing-example: error
  rule/schema-properties-description:
    severity: error
    message: Каждое свойство схемы должно иметь непустой description.
    subject:
      type: Schema
      property: description
    where:
      - subject:
          type: SchemaProperties
        assertions:
          defined: true
    assertions:
      defined: true
      pattern: /\S/
