openapi: 3.1.0
info:
  title: Stageby API
  version: 0.0.0
  description: API приложения Stageby для управления задачами.
servers:
  - url: http://127.0.0.1:3001
    description: Локальный сервер разработки
security: []
paths:
  /todos:
    get:
      operationId: listTodos
      tags: [Todos]
      security: []
      summary: List todos
      responses:
        '200':
          description: Todo list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      operationId: createTodo
      tags: [Todos]
      security: []
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodo'
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      operationId: getTodo
      tags: [Todos]
      security: []
      summary: Get a todo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    patch:
      operationId: updateTodo
      tags: [Todos]
      security: []
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodo'
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        '404':
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    delete:
      operationId: deleteTodo
      tags: [Todos]
      security: []
      summary: Delete a todo
      responses:
        '204':
          description: Todo deleted
        '404':
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Todo:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - completed
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - "123e4567-e89b-42d3-a456-426614174000"
          description: "Стабильный UUID задачи."
          type: string
          format: uuid
        title:
          examples:
            - "Подготовить список задач"
          description: "Название задачи."
          type: string
          minLength: 1
          maxLength: 255
        description:
          examples:
            - "Составить список задач на следующую неделю."
            - null
          description: "Подробное описание задачи; null — описание отсутствует."
          type:
            - string
            - 'null'
        completed:
          examples:
            - false
          description: "Признак завершённой задачи."
          type: boolean
        createdAt:
          examples:
            - "2026-09-20T08:00:00Z"
          description: "Дата и время создания записи в UTC, формат RFC 3339."
          type: string
          format: date-time
        updatedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время последнего изменения записи в UTC, формат RFC 3339."
          type: string
          format: date-time
    CreateTodo:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          examples:
            - "Подготовить список задач"
          description: "Название задачи."
          type: string
          minLength: 1
          maxLength: 255
        description:
          examples:
            - "Составить список задач на следующую неделю."
            - null
          description: "Подробное описание задачи; null — описание отсутствует."
          type:
            - string
            - 'null'
    UpdateTodo:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          examples:
            - "Подготовить список задач"
          description: "Название задачи."
          type: string
          minLength: 1
          maxLength: 255
        description:
          examples:
            - "Составить список задач на следующую неделю."
            - null
          description: "Подробное описание задачи; null — описание отсутствует."
          type:
            - string
            - 'null'
        completed:
          examples:
            - false
          description: "Признак завершённой задачи."
          type: boolean
