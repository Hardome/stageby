paths:
  /projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: Список объектов строительства
      description: Руководитель и инженер-сметчик. Мастер и приёмщик работают через /stages без доступа к полной
        карточке клиента. Сортировка createdAt DESC, id ASC. Фильтры AND.
      parameters:
        - $ref: ../common/common.yaml#/components/parameters/Limit
        - $ref: ../common/common.yaml#/components/parameters/Offset
        - name: isArchived
          in: query
          required: false
          description: По умолчанию только активные проекты.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          description: Подстрока названия, имени клиента, адреса или кадастрового номера без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Составное создание объекта
      description: "Только руководитель. В одной транзакции создаёт проект, выбранные этапы и индивидуальные
        чек-листы. Если checklistItems этапа отсутствует, сервер копирует активный шаблон его типа. Ошибка любого
        этапа откатывает всю операцию. Защита интерфейса от повторной отправки будет реализована на фронтенде.
        Идентификаторы файлов относятся к предварительно успешно загруженным PDF проекта."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Карточка проекта
      description: Руководитель и инженер-сметчик. Финансы выдаются отдельным методом.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    patch:
      operationId: updateProject
      tags:
        - Projects
      summary: Изменить или архивировать проект
      description: Только руководитель. Архивирование не удаляет историю, делает этапы и чек-листы проекта
        доступными только для чтения. Разархивирование — isArchived=false. Физического удаления проекта и
        фиксированных этапов нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
components:
  schemas:
    Coordinates:
      type: object
      additionalProperties: false
      description: "Географические координаты объекта в десятичных градусах."
      required:
        - latitude
        - longitude
      properties:
        latitude:
          examples:
            - 56.8389
          description: "Географическая широта в десятичных градусах, от −90 до 90."
          type: number
          minimum: -90
          maximum: 90
        longitude:
          examples:
            - 60.6057
          description: "Географическая долгота в десятичных градусах, от −180 до 180."
          type: number
          minimum: -180
          maximum: 180
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerName
        - address
        - coordinates
        - cadastralNumber
        - houseDesign
        - contractLabel
        - plannedStartDate
        - plannedEndDate
        - notes
        - isArchived
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 101
          description: "Стабильный ID проекта — объекта строительства."
          type: integer
          minimum: 1
          maximum: 2147483647
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 255
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Обязательные географические координаты объекта для отображения на карте."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта в текстовом виде; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома, например «Семья 67»; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null — не указан. Не является идентификатором пользователя."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Плановая дата начала проекта в формате YYYY-MM-DD."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Плановая дата окончания проекта в формате YYYY-MM-DD, не раньше даты начала."
          type: string
          format: date
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null — отсутствуют."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        isArchived:
          examples:
            - false
          description: "Признак архивного проекта. Архивный проект и его этапы доступны только для чтения."
          type: boolean
        createdAt:
          examples:
            - "2026-09-20T08:00:00Z"
          description: "Дата и время создания записи в UTC, формат RFC 3339."
          type: string
          format: date-time
        updatedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время последнего изменения записи в UTC, формат RFC 3339."
          type: string
          format: date-time
    CreateProject:
      type: object
      additionalProperties: false
      required:
        - ownerName
        - address
        - coordinates
        - plannedStartDate
        - plannedEndDate
        - documentFileIds
        - stages
      properties:
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 255
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Обязательные географические координаты объекта."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта в текстовом виде; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома, например «Семья 67»; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null — не указан. Не является идентификатором пользователя."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Плановая дата начала проекта в формате YYYY-MM-DD."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Плановая дата окончания проекта в формате YYYY-MM-DD, не раньше даты начала."
          type: string
          format: date
        documentFileIds:
          description: "Идентификаторы предварительно успешно загруженных PDF проекта. Пустой список разрешён."
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
        stages:
          description: "Выбранные этапы объекта. Типы этапов не повторяются, порядок массива не влияет на position."
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/CreateProjectStage"
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null — отсутствуют."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
    UpdateProject:
      type: object
      additionalProperties: false
      properties:
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 255
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Новый обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Новые обязательные географические координаты объекта."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Новая плановая дата начала проекта. Все этапы должны остаться внутри срока проекта."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Новая плановая дата окончания проекта, не раньше даты начала."
          type: string
          format: date
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        isArchived:
          examples:
            - false
          description: "Признак архивного проекта. Архивный проект и его этапы доступны только для чтения."
          type: boolean
      minProperties: 1
    CreateProjectStage:
      type: object
      additionalProperties: false
      required:
        - type
        - plannedStartDate
        - plannedEndDate
        - canRunInParallel
        - assigneeId
        - plannedWorkAmountMinor
        - plannedMaterialAmountMinor
      properties:
        type:
          $ref: ../common/common.yaml#/components/schemas/StageType
        plannedStartDate:
          examples:
            - "2026-10-05"
          type: string
          format: date
          description: "Плановое начало этапа внутри срока проекта."
        plannedEndDate:
          examples:
            - "2026-10-30"
          type: string
          format: date
          description: "Плановое окончание этапа внутри срока проекта, не раньше начала этапа."
        canRunInParallel:
          examples:
            - false
          type: boolean
          description: "Может ли этап выполняться параллельно с соседними этапами."
        assigneeId:
          examples:
            - 17
            - null
          description: "Активный мастер этапа; null — мастер пока не назначен."
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 2147483647
        plannedWorkAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        plannedMaterialAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        checklistItems:
          description: "Изменённый индивидуальный список. Если поле отсутствует, копируется активный шаблон типа этапа."
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateProjectChecklistItem"
    CreateProjectChecklistItem:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          examples:
            - "Армирование"
          description: "Название индивидуального пункта чек-листа."
          type: string
          minLength: 1
          maxLength: 500
        photoHint:
          examples:
            - "Фото перевязки углов и перехлёста арматуры"
            - null
          description: "Необязательная подсказка о том, что должно быть видно на фотографии."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          description: "Проекты текущей страницы с учётом фильтров и прав доступа."
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          examples:
            - 1
          description: "Общее количество записей с учётом фильтров и прав доступа до применения limit и offset."
          type: integer
          minimum: 0
        limit:
          examples:
            - 20
          description: "Применённый размер страницы; количество items может быть меньше."
          type: integer
          minimum: 1
          maximum: 100
        offset:
          examples:
            - 0
          description: "Количество пропущенных записей после фильтрации и проверки доступа."
          type: integer
          minimum: 0
