paths:
  /projects/{projectId}/edit:
    get:
      operationId: getProjectEdit
      tags: [Projects]
      summary: Загрузить форму редактирования объекта
      description: Только руководитель. Согласованный снимок реквизитов, документов, всех этапов (включая исключённые), чек-листов и версий.
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID объекта.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: Данные формы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEdit'
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
  /projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: Список объектов строительства
      description: Только руководитель. Мастер работает через /stages без доступа к полной карточке объекта и
        общим суммам. Сортировка createdAt DESC, id ASC. Фильтры AND.
      parameters:
        - $ref: ../common/common.yaml#/components/parameters/Limit
        - $ref: ../common/common.yaml#/components/parameters/Offset
        - name: isArchived
          in: query
          required: false
          description: По умолчанию только активные проекты.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          description: Подстрока названия, имени клиента, адреса или кадастрового номера без учёта регистра.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Составное создание объекта
      description: "Только руководитель. В одной транзакции создаёт проект, выбранные этапы и индивидуальные
        чек-листы. Если checklistItems этапа отсутствует, сервер копирует активный шаблон его типа. Ошибка любого
        этапа откатывает всю операцию. Счета материалов в этот запрос не входят и добавляются отдельно к уже
        созданному этапу. Идентификаторы файлов относятся только к предварительно успешно загруженным PDF проекта.
        Повтор с тем же Idempotency-Key и тем же телом возвращает ранее созданный объект; тот же ключ с другим
        телом возвращает 409 idempotency_conflict."
      parameters:
        - $ref: ../common/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Карточка проекта
      description: Только руководитель. Мастер получает только назначенные ему этапы через /stages.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    patch:
      operationId: updateProject
      tags:
        - Projects
      summary: Изменить или архивировать проект
      description: >-
        Только руководитель. Атомарно сохраняет реквизиты, документы, этапы, чек-листы
        и дополнительный этап. Проверяет версии и итоговое состояние формы. Пропущенные поля и этапы
        сохраняются; null очищает nullable-поле. Исключение явно задаётся isIncluded=false, разрешено
        до фактического старта и без фото (включая удалённые), счетов и выплат. Восстановление сохраняет
        ID и историю. Минимум один включённый этап обязателен. Архивный объект допускает только отдельное
        разархивирование isArchived=false. Общие планы объекта не редактируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
components:
  schemas:
    Coordinates:
      type: object
      additionalProperties: false
      description: "Географические координаты объекта в десятичных градусах."
      required:
        - latitude
        - longitude
      properties:
        latitude:
          examples:
            - 56.8389
          description: "Географическая широта в десятичных градусах, от −90 до 90."
          type: number
          minimum: -90
          maximum: 90
        longitude:
          examples:
            - 60.6057
          description: "Географическая долгота в десятичных градусах, от −180 до 180."
          type: number
          minimum: -180
          maximum: 180
    ProjectEdit:
      type: object
      additionalProperties: false
      required: [project, stages]
      properties:
        project:
          description: Реквизиты, документы, версия и вычисленные итоги объекта.
          $ref: '#/components/schemas/Project'
        stages:
          type: array
          description: Все этапы, включая исключённые, по position ASC; только для руководителя.
          items:
            $ref: '#/components/schemas/ProjectEditStage'
    ProjectEditStage:
      type: object
      additionalProperties: false
      required: [stage, checklist]
      properties:
        stage:
          description: Параметры и версия этапа.
          $ref: ../stages/stages.yaml#/components/schemas/Stage
        checklist:
          description: Индивидуальный чек-лист и его версия.
          $ref: ../checklists/checklists.yaml#/components/schemas/Checklist
    UpdateProjectStage:
      type: object
      additionalProperties: false
      required: [id, expectedVersion]
      properties:
        id:
          description: ID существующей записи.
          example: 1
          type: integer
          minimum: 1
          maximum: 2147483647
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        isIncluded:
          description: Явное включение или исключение этапа.
          example: true
          type: boolean
        assigneeId:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/assigneeId
        plannedStartDate:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/plannedStartDate
        plannedEndDate:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/plannedEndDate
        plannedWorkAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        plannedMaterialAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        workSubtypes:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/workSubtypes
        notes:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/notes
        checklist:
          description: Индивидуальный чек-лист и его версия.
          $ref: ../checklists/checklists.yaml#/components/schemas/ConfigureChecklist
    CreateAdditionalStage:
      type: object
      additionalProperties: false
      required: [checklistItems]
      description: Новый additional на последней позиции. Если запись уже существует, используйте stages с её ID для восстановления.
      properties:
        assigneeId:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/assigneeId
        plannedStartDate:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/plannedStartDate
        plannedEndDate:
          $ref: ../stages/stages.yaml#/components/schemas/UpdateStage/properties/plannedEndDate
        plannedWorkAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        plannedMaterialAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        checklistItems:
          description: Непустой индивидуальный чек-лист дополнительного этапа.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateProjectChecklistItem'
    Project:
      description: Реквизиты, версия и вычисленные итоги объекта.
      type: object
      additionalProperties: false
      required:
        - id
        - ownerName
        - address
        - coordinates
        - cadastralNumber
        - houseDesign
        - contractLabel
        - plannedStartDate
        - plannedEndDate
        - notes
        - isArchived
        - version
        - status
        - finances
        - documentFileIds
        - createdAt
        - updatedAt
      properties:
        version:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        status:
          $ref: ../common/common.yaml#/components/schemas/ProjectStatus
        finances:
          $ref: ../common/common.yaml#/components/schemas/ProjectFinancialSummary
        documentFileIds:
          type: array
          description: Загруженные PDF проекта в порядке position ASC.
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
        id:
          examples:
            - 101
          description: "Стабильный ID проекта — объекта строительства."
          type: integer
          minimum: 1
          maximum: 2147483647
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 255
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Обязательные географические координаты объекта для отображения на карте."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта в текстовом виде; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома, например «Семья 67»; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null — не указан. Не является идентификатором пользователя."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Плановая дата начала проекта в формате YYYY-MM-DD."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Плановая дата окончания проекта в формате YYYY-MM-DD, не раньше даты начала."
          type: string
          format: date
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null — отсутствуют."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        isArchived:
          examples:
            - false
          description: "Признак архивного проекта. Архивный проект и его этапы доступны только для чтения."
          type: boolean
        createdAt:
          examples:
            - "2026-09-20T08:00:00Z"
          description: "Дата и время создания записи в UTC, формат RFC 3339."
          type: string
          format: date-time
        updatedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время последнего изменения записи в UTC, формат RFC 3339."
          type: string
          format: date-time
    CreateProject:
      type: object
      additionalProperties: false
      required:
        - ownerName
        - address
        - coordinates
        - plannedStartDate
        - plannedEndDate
        - documentFileIds
        - stages
      properties:
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 150
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Обязательные географические координаты объекта."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта в текстовом виде; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома, например «Семья 67»; null — не указан."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null — не указан. Не является идентификатором пользователя."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Плановая дата начала проекта в формате YYYY-MM-DD."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Плановая дата окончания проекта в формате YYYY-MM-DD, не раньше даты начала."
          type: string
          format: date
        documentFileIds:
          description: "Идентификаторы предварительно успешно загруженных PDF проекта. Пустой список разрешён."
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
        stages:
          description: "Все включённые стандартные этапы, включая неоткрытые в форме. Для неоткрытого этапа достаточно type. Пропущенные типы не создаются; additional запрещён. Типы не повторяются, порядок массива не влияет на position."
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/CreateProjectStage"
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null — отсутствуют."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
    UpdateProject:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        documentFileIds:
          type: array
          uniqueItems: true
          description: Полный список PDF. Существующие связи сохраняются; новые файлы предварительно загружены руководителем.
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
        stages:
          description: Частичные изменения существующих этапов.
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/UpdateProjectStage'
        additionalStage:
          $ref: '#/components/schemas/CreateAdditionalStage'
        ownerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента или собственника объекта строительства."
          type: string
          minLength: 1
          maxLength: 150
        address:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Новый обязательный адрес объекта строительства."
          type: string
          minLength: 1
          maxLength: 1000
        coordinates:
          description: "Новые обязательные географические координаты объекта."
          $ref: "#/components/schemas/Coordinates"
        cadastralNumber:
          examples:
            - "66:41:0000000:123"
            - null
          description: "Кадастровый номер объекта; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        houseDesign:
          examples:
            - "Семья 67"
            - null
          description: "Название варианта дома; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        contractLabel:
          examples:
            - "Договор по объекту «Дом на Лесной»"
            - null
          description: "Текстовый реквизит «договор» из исходной ведомости; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        plannedStartDate:
          examples:
            - "2026-10-05"
          description: "Новая плановая дата начала проекта. Все этапы должны остаться внутри срока проекта."
          type: string
          format: date
        plannedEndDate:
          examples:
            - "2027-05-28"
          description: "Новая плановая дата окончания проекта, не раньше даты начала."
          type: string
          format: date
        notes:
          examples:
            - "Въезд на участок со стороны Лесной улицы."
            - null
          description: "Примечания к проекту; null очищает сохранённое значение."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        isArchived:
          examples:
            - false
          description: "Признак архивного проекта. Архивный проект и его этапы доступны только для чтения."
          type: boolean
      minProperties: 2
    CreateProjectStage:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          description: "Стандартный тип этапа; дополнительный этап доступен только при редактировании."
          $ref: ../common/common.yaml#/components/schemas/StageType
        plannedStartDate:
          examples:
            - "2026-10-05"
          type: [string, "null"]
          format: date
          description: "Необязательное независимое начало внутри срока проекта. Отсутствие или null означает незаданную дату."
        plannedEndDate:
          examples:
            - "2026-10-30"
          type: [string, "null"]
          format: date
          description: "Необязательное независимое окончание внутри срока проекта; при заданном начале не раньше него. Отсутствие или null означает незаданную дату."
        assigneeId:
          examples:
            - 17
            - null
          description: "Активный мастер этапа; отсутствие или null — мастер пока не назначен. Становится получателем новых фактических выплат."
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 2147483647
        plannedWorkAmountMinor:
          description: "Ручной план работ. Отсутствие или null — план не задан; 0 — заданный нулевой план. После приёмки статус оплаты определяется сравнением плана и фактических выплат."
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        plannedMaterialAmountMinor:
          description: "Ручной план материалов. Отсутствие или null — план не задан. Счета добавляются после создания объекта."
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        checklistItems:
          description: "Изменённый индивидуальный список. Если поле отсутствует, копируется активный шаблон типа этапа."
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateProjectChecklistItem"
    CreateProjectChecklistItem:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          examples:
            - "Армирование"
          description: "Название индивидуального пункта чек-листа."
          type: string
          minLength: 1
          maxLength: 500
        photoHint:
          examples:
            - "Фото перевязки углов и перехлёста арматуры"
            - null
          description: "Необязательная подсказка о том, что должно быть видно на фотографии."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
