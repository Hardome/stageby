  /stages/{stageId}/acceptance:
    $ref: ../stages/stages.yaml#/paths/~1stages~1{stageId}~1acceptance
  /stages/{stageId}/rework:
    $ref: ../stages/stages.yaml#/paths/~1stages~1{stageId}~1rework
  /stages/{stageId}/checklist:
    $ref: ../checklists/checklists.yaml#/paths/~1stages~1{stageId}~1checklist
  /stages/{stageId}/checklist/items/{itemId}:
    $ref: ../checklists/checklists.yaml#/paths/~1stages~1{stageId}~1checklist~1items~1{itemId}
