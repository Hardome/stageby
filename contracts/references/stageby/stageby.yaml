  /projects/{projectId}:
    $ref: ../projects/projects.yaml#/paths/~1projects~1{projectId}
  /stages:
    $ref: ../stages/stages.yaml#/paths/~1stages
  /projects/{projectId}/stages:
    $ref: ../stages/stages.yaml#/paths/~1projects~1{projectId}~1stages
  /stages/{stageId}:
