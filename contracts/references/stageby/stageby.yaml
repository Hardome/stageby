openapi: 3.1.0
info:
  title: Stageby API
  version: 0.1.0
  description: "Контракт первой версии управления строительством: пользователи, проекты, этапы и чек-листы.
    Финансовый модуль, фото, материалы, инструмент и платежи отложены. Реализация новых маршрутов выполняется
    отдельно. ID новых сущностей — положительные целые числа int32, назначаемые БД автоматически. Даты работ YYYY-MM-DD; timestamps — RFC 3339 UTC. Календарный часовой пояс
    первой версии Asia/Yekaterinburg. PATCH меняет только переданные поля, null очищает только nullable-поле,
    пустое тело запрещено; массив заменяется целиком. Все изменения атомарны. Неизвестные поля и
    query-параметры — 400. Непустые текстовые значения обрезаются по краям и не могут состоять только из
    пробелов; пароли не обрезаются. Политики доступа обязательны на сервере, включая списки, total и вложенные
    записи. Документ описывает целевой API."
servers:
  - url: /
    description: Тот же origin, с которого загружены API-документация или клиент.
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Логин, пароль и сессии. Первого руководителя создаёт административная команда при развёртывании,
      публичной регистрации нет.
  - name: Users
    description: Сотрудники и исполнители. Управление только руководителем.
  - name: Projects
    description: Объекты строительства и данные клиента.
  - name: Stages
    description: Фиксированные виды работ, назначения, зависимости и приёмка.
  - name: Checklists
    description: Один чек-лист с контрольными точками на этап. В текущей версии без фото.
