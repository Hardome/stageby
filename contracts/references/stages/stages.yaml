paths:
  /stage-types:
    get:
      operationId: listActiveStageTypes
      tags:
        - Stages
      summary: Активные типы этапов и шаблоны
      description: Только руководитель. Возвращает активный справочник в порядке position ASC и ровно тот активный шаблон каждого типа, который сервер копирует при создании объекта, включая photoHint. Ответ не содержит неактивные редакции.
      responses:
        "200":
          description: Активные типы этапов с шаблонами чек-листов.
          content:
            application/json:
              schema:
                type: array
                maxItems: 9
                items:
                  $ref: "#/components/schemas/ActiveStageType"
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
  /stages:
    get:
      operationId: listStages
      tags:
        - Stages
      summary: Список доступных этапов
      description: Руководитель видит все этапы; мастер — только где assigneeId равен его ID. Фильтры AND применяются после ограничения доступа, total не
        раскрывает чужие записи. По умолчанию без архивных проектов. Сортировка projectId ASC, position ASC,
        id ASC.
      parameters:
        - $ref: ../common/common.yaml#/components/parameters/Limit
        - $ref: ../common/common.yaml#/components/parameters/Offset
        - name: projectId
          in: query
          required: false
          description: Фильтр проекта.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: assigneeId
          in: query
          required: false
          description: Фильтр мастера; не расширяет доступ.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          description: Рабочий статус.
          schema:
            $ref: "#/components/schemas/StageStatus"
        - name: includeArchived
          in: query
          required: false
          description: Включить этапы архивных проектов.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagePage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
  /projects/{projectId}/stages:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: listProjectStages
      tags:
        - Stages
      summary: Этапы одного проекта
      description: "Без пагинации: максимум девять записей, position ASC. Руководитель видит включённые этапы;
        мастер — только назначенные ему. Для существующего проекта вне области доступа возвращается
        404."
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStages"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
  /stages/{stageId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getStage
      tags:
        - Stages
      summary: Карточка этапа
      description: Доступ как у /stages. Карточка содержит клиента, адрес и координаты для выезда. latestAcceptance хранит последнее решение, не журнал всех проверок.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    patch:
      operationId: updateStage
      tags:
        - Stages
      summary: Настроить этап
      description: Только руководитель. Можно передать любое непустое сочетание полей; все проверки
        выполняются по результирующей записи, изменения атомарны и увеличивают version один раз.
        Назначать можно только активного foreman; null снимает назначение. Даты, мастер и ручные планы
        редактируются после старта, включая completed и paid; фактические даты сохраняются.
        Для paid план работ должен оставаться заданным, а остаток работ — не больше нуля,
        иначе возвращается 409 invalid_transition без изменения статуса.
        Даты независимо nullable; каждая заданная дата находится внутри обеих границ проекта,
        окончание не раньше начала при наличии обеих дат; соседние этапы не переносятся.
        Устаревшая expectedVersion — 409 version_conflict, архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStage"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
  /stages/{stageId}/status:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    put:
      operationId: changeStageStatus
      tags:
        - Stages
      summary: Перевести этап в следующий рабочий статус
      description: Только руководитель. Явно разрешены assigned→supplied при наличии хотя бы одного заказа,
        хотя бы одного счёта в каждом заказе и доставке всех счетов, а также completed→paid при нулевом остатке
        по работам. Старт, переход на приёмку и возврат с доработки выполняются автоматически изменением пунктов.
        Повтор текущего статуса с актуальной версией возвращает запись без изменения. Остальные переходы —
        409 invalid_transition. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStageStatus"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
  /stages/{stageId}/acceptance:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: acceptStage
      tags:
        - Stages
      summary: Принять этап
      description: Только руководитель. Только из acceptance, при всех выполненных пунктах.
        Атомарно записывает latestAcceptance с decision=accepted, текущим пользователем, временем и
        correctionDueDate=null; переводит этап в completed и устанавливает actualEndDate. Это электронная
        отметка приёмки, не PDF и не юридически значимая подпись. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptStage"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
  /stages/{stageId}/rework:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    post:
      operationId: returnStageForRework
      tags:
        - Stages
      summary: Вернуть этап на доработку
      description: Только руководитель. Только из acceptance. Замечание, дата исправления и
        itemIds обязательны; дата не раньше текущей даты объекта. Интерфейс может предложить сегодня + 2
        календарных дня, сервер не угадывает срок. Все itemIds должны принадлежать этому чек-листу, иначе 400
        invalid_request. Переводит в rework, пишет latestAcceptance с decision=rejected и сбрасывает
        только указанные пункты для повторной проверки (completedAt/completedBy=null), остальные отметки
        сохраняет. Увеличивает версии этапа и чек-листа атомарно. Архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectStage"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
components:
  schemas:
    ChecklistTemplateItem:
      type: object
      additionalProperties: false
      required:
        - id
        - position
        - title
        - photoHint
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 501
          description: Идентификатор пункта активного шаблона.
        position:
          type: integer
          minimum: 1
          example: 1
          description: Порядок копирования пункта в индивидуальный чек-лист.
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: Армирование
          description: Название, копируемое в новый этап.
        photoHint:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          example: Фото перевязки углов и перехлёста арматуры
          description: Фотоподсказка, копируемая в новый этап; null — подсказки нет.
    ActiveStageType:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - position
        - checklistTemplateId
        - checklistItems
      properties:
        code:
          $ref: ../common/common.yaml#/components/schemas/StageType
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Фундамент
          description: Отображаемое название активного типа.
        position:
          type: integer
          minimum: 1
          maximum: 9
          example: 1
          description: Порядок типа в объекте.
        checklistTemplateId:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          example: 81
          description: Идентификатор активной редакции шаблона, полезный для диагностики изменения справочника.
        checklistItems:
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/ChecklistTemplateItem"
          description: Пункты активного шаблона в порядке position ASC; эти значения сервер копирует при отсутствии checklistItems в запросе создания.
    StageType:
      $ref: ../common/common.yaml#/components/schemas/StageType
    StageStatus:
      $ref: ../common/common.yaml#/components/schemas/StageStatus
    Acceptance:
      type: object
      additionalProperties: false
      required:
        - decision
        - comment
        - correctionDueDate
        - decidedBy
        - decidedAt
      properties:
        decision:
          examples:
            - "rejected"
          description: "Решение по этапу: accepted — принят, rejected — возвращён на доработку."
          type: string
          enum:
            - accepted
            - rejected
        comment:
          examples:
            - "Устранить замечания по качеству выполнения контрольной точки."
            - null
          description: "Комментарий к решению. Для возврата на доработку содержит обязательное замечание; при приёмке может быть null."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        correctionDueDate:
          examples:
            - "2026-09-27"
            - null
          description: "Срок исправления замечаний в формате YYYY-MM-DD при возврате на доработку; null — этап принят."
          type:
            - string
            - "null"
          format: date
        decidedBy:
          $ref: ../users/users.yaml#/components/schemas/UserBrief
        decidedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время принятия решения в UTC, формат RFC 3339. Устанавливается сервером."
          type: string
          format: date-time
    Stage:
      description: Параметры, финансовые итоги и версия этапа.
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectOwnerName
        - projectAddress
        - projectCoordinates
        - projectIsArchived
        - type
        - title
        - position
        - isIncluded
        - workSubtypes
        - assignee
        - status
        - plannedStartDate
        - plannedEndDate
        - plannedWorkAmountMinor
        - actualWorkAmountMinor
        - workBalanceAmountMinor
        - plannedMaterialAmountMinor
        - actualMaterialAmountMinor
        - totalPlannedAmountMinor
        - totalActualAmountMinor
        - materialSummary
        - actualStartDate
        - actualEndDate
        - predecessorStageIds
        - notes
        - progressPercent
        - latestAcceptance
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 1001
          description: "Стабильный ID этапа строительства."
          type: integer
          minimum: 1
          maximum: 2147483647
        projectId:
          examples:
            - 101
          description: "Стабильный ID проекта, которому принадлежит запись."
          type: integer
          minimum: 1
          maximum: 2147483647
        projectOwnerName:
          examples:
            - "Анна Смирнова"
          description: "Имя клиента объекта, необходимое странице «Мои этапы»."
          type: string
          minLength: 1
          maxLength: 255
        projectAddress:
          examples:
            - "Екатеринбург, ул. Лесная, д. 10"
          description: "Адрес объекта строительства для выезда на этап."
          type: string
          minLength: 1
          maxLength: 1000
        projectCoordinates:
          description: "Координаты объекта строительства для выезда на этап."
          $ref: ../projects/projects.yaml#/components/schemas/Coordinates
        projectIsArchived:
          examples:
            - false
          description: "Признак архивного проекта. Если true, изменения этапа запрещены."
          type: boolean
        type:
          $ref: "#/components/schemas/StageType"
        title:
          examples:
            - "Фундамент"
          type: string
          enum:
            - Фундамент
            - Стены
            - Крыша
            - Окна, двери
            - Фасад
            - Электрика
            - Штукатурка
            - Отопление
            - Дополнительный этап
          description: Название однозначно определяется type и не меняется.
        position:
          examples:
            - 1
          type: integer
          minimum: 1
          maximum: 9
          description: Фиксированный порядок отображения типов, от фундамента до отопления. Не определяет зависимости.
        isIncluded:
          type: boolean
          description: Включён ли этап в списки, расчёты и завершение объекта.
          example: true
        workSubtypes:
          description: "Названия подтипов работ этого этапа. Пустой список означает отсутствие подтипов."
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          maxItems: 30
          uniqueItems: true
        assignee:
          description: "Назначенный ответственный мастер; null — мастер не назначен."
          anyOf:
            - $ref: ../users/users.yaml#/components/schemas/UserBrief
            - type: "null"
        status:
          $ref: "#/components/schemas/StageStatus"
        plannedStartDate:
          examples:
            - "2026-09-21"
          description: "Плановая дата начала этапа в формате YYYY-MM-DD."
          type: [string, "null"]
          format: date
        plannedEndDate:
          examples:
            - "2026-09-28"
          description: "Плановая дата окончания этапа в формате YYYY-MM-DD, не раньше планового начала."
          type: [string, "null"]
          format: date
        plannedWorkAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        actualWorkAmountMinor:
          readOnly: true
          description: Сумма всех платежей за работы этапа.
          allOf:
            - $ref: ../common/common.yaml#/components/schemas/MoneyAmountMinor
        workBalanceAmountMinor:
          readOnly: true
          description: План работ минус фактические платежи; отрицательное значение означает переплату, null — план не задан.
          allOf:
            - $ref: ../common/common.yaml#/components/schemas/SignedMoneyAmountMinor
        plannedMaterialAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        actualMaterialAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/MoneyAmountMinor
        totalPlannedAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        totalActualAmountMinor:
          $ref: ../common/common.yaml#/components/schemas/MoneyAmountMinor
        materialSummary:
          $ref: ../dashboard/dashboard.yaml#/components/schemas/MaterialIndicator
        actualStartDate:
          examples:
            - "2026-09-21"
            - null
          description: "Фактическая дата первого старта в формате YYYY-MM-DD. Устанавливается сервером; null — этап ещё не стартовал."
          type:
            - string
            - "null"
          format: date
        actualEndDate:
          examples:
            - "2026-09-28"
            - null
          description: "Фактическая дата завершения в формате YYYY-MM-DD. Устанавливается сервером при приёмке; null — этап ещё не принят."
          type:
            - string
            - "null"
          format: date
        predecessorStageIds:
          description: "ID обязательных предшественников из того же проекта. Все должны быть завершены до старта; пустой список допускает параллельную работу. Ссылки на себя и циклы запрещены."
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          maxItems: 7
          uniqueItems: true
        notes:
          examples:
            - "Согласовать время доставки бетона."
            - null
          description: "Примечания к этапу; null — отсутствуют."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 × выполненные пункты / все пункты, округление до целого. Пустой чек-лист — 0. Только
            вычисляется сервером.
          examples:
            - 33
        latestAcceptance:
          description: "Последнее решение о приёмке или доработке; null — решений ещё не было. Полная история проверок не возвращается."
          anyOf:
            - $ref: "#/components/schemas/Acceptance"
            - type: "null"
        version:
          examples:
            - 1
          type: integer
          minimum: 1
          description: Версия записи. Увеличивается при каждом изменении.
        createdAt:
          examples:
            - "2026-09-20T08:00:00Z"
          description: "Дата и время создания записи в UTC, формат RFC 3339."
          type: string
          format: date-time
        updatedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время последнего изменения записи в UTC, формат RFC 3339."
          type: string
          format: date-time
    StagePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          description: "Этапы текущей страницы с учётом фильтров и прав доступа."
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        total:
          examples:
            - 1
          description: "Общее количество записей с учётом фильтров и прав доступа до применения limit и offset."
          type: integer
          minimum: 0
        limit:
          examples:
            - 20
          description: "Применённый размер страницы; количество items может быть меньше."
          type: integer
          minimum: 1
          maximum: 100
        offset:
          examples:
            - 0
          description: "Количество пропущенных записей после фильтрации и проверки доступа."
          type: integer
          minimum: 0
    ProjectStages:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: "Доступные пользователю включённые этапы одного проекта, максимум девять, в порядке position ASC. Без пагинации."
          type: array
          items:
            $ref: "#/components/schemas/Stage"
          maxItems: 9
    UpdateStage:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        assigneeId:
          examples:
            - 1
            - null
          description: "ID назначаемого ответственного мастера; null снимает назначение, если это допускает текущее состояние этапа."
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 2147483647
        plannedWorkAmountMinor:
          description: Новый план оплаты работ; null очищает план. Доступно только руководителю.
          allOf:
            - $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        plannedMaterialAmountMinor:
          description: Новый план материалов; null очищает план. Доступно только руководителю.
          allOf:
            - $ref: ../common/common.yaml#/components/schemas/PlannedMoneyAmountMinor
        workSubtypes:
          description: "Новый полный список подтипов работ этапа; заменяет предыдущий целиком. Пустой список удаляет все подтипы."
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          maxItems: 30
          uniqueItems: true
        plannedStartDate:
          examples:
            - "2026-09-21"
          description: "Новая плановая дата начала этапа в формате YYYY-MM-DD; null очищает дату. Заданная дата должна остаться внутри обеих границ проекта."
          type: [string, "null"]
          format: date
        plannedEndDate:
          examples:
            - "2026-09-28"
          description: "Новая плановая дата окончания этапа в формате YYYY-MM-DD; null очищает дату. Заданная дата должна остаться внутри обеих границ проекта и быть не раньше начала, если оно задано. Соседние этапы автоматически не переносятся."
          type: [string, "null"]
          format: date
        notes:
          examples:
            - "Согласовать время доставки бетона."
            - null
          description: "Новые примечания к этапу; null очищает сохранённые примечания."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
      minProperties: 2
    ChangeStageStatus:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - status
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        status:
          examples:
            - "supplied"
          description: "Явный переход в supplied после комплектации или в paid после полной выплаты работ. Повтор текущего статуса допустим; остальные переходы запрещены."
          type: string
          enum:
            - supplied
            - paid
    AcceptStage:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        comment:
          examples:
            - "Работы проверены и приняты без замечаний."
            - null
          description: "Необязательный комментарий к приёмке этапа; null — без комментария."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5000
    RejectStage:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - comment
        - itemIds
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        comment:
          examples:
            - "Устранить замечания по качеству выполнения контрольной точки."
          description: "Обязательное замечание с причиной возврата этапа на доработку."
          type: string
          minLength: 1
          maxLength: 5000
        correctionDueDate:
          examples:
            - "2026-09-27"
          description: "Срок исправления в формате YYYY-MM-DD, не раньше сегодня в Asia/Yekaterinburg. По умолчанию сегодня + 2 календарных дня."
          type: string
          format: date
        itemIds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          minItems: 1
          uniqueItems: true
          description: Пункты текущего чек-листа, требующие повторного выполнения.
