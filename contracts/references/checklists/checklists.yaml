paths:
  /stages/{stageId}/checklist:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getStageChecklist
      tags:
        - Checklists
      summary: Чек-лист этапа
      description: Один чек-лист на этап, создаётся вместе с проектом. Руководитель видит любой чек-лист,
        мастер — только чек-лист назначенного ему этапа.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
    put:
      operationId: configureStageChecklist
      tags:
        - Checklists
      summary: Настроить контрольные точки
      description: "Только руководитель. Только до старта: created, assigned или supplied. Атомарно заменяет
        весь состав на непустой список. Создаёт новые ID пунктов, все отметки false, position начинается с 1;
        Старые пункты помечаются удалёнными, фото и история сохраняются. Увеличивает версии чек-листа и этапа. expectedVersion относится к чек-листу. После старта состав
        фиксирован. Архив — 409 project_archived. Названия не должны состоять из пробелов."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureChecklist"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
  /stages/{stageId}/checklist/items/{itemId}:
    parameters:
      - name: stageId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: itemId
        in: path
        required: true
        description: Стабильный идентификатор записи.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    patch:
      operationId: updateChecklistItem
      tags:
        - Checklists
      summary: Отметить или снять выполнение пункта
      description: Руководитель или назначенный мастер. Первый явно выполненный пункт начинает этап из assigned
        или supplied, устанавливает actualStartDate и возвращает предупреждение materials_incomplete при старте
        из assigned. Если непосредственно предыдущий включённый этап ещё не completed/paid, также возвращает
        predecessor_incomplete, но не блокирует выполнение. Для isCompleted=true нужна хотя бы одна успешно
        загруженная активная фотография. Сама
        загрузка фотографии пункт не выполняет. itemId должен принадлежать чек-листу данного этапа, иначе 404.
        expectedVersion — версия всего чек-листа. false→true устанавливает completedAt и completedBy на
        сервере; true→false очищает их. Повтор текущего значения с актуальной версией — без изменений.
        Пересчитывает целочисленный прогресс и атомарно увеличивает версии чек-листа и этапа. Последний пункт
        непустого чек-листа автоматически переводит этап в acceptance. В rework мастер может менять только
        отмеченные для доработки пункты; повторное выполнение всех замечаний возвращает acceptance. Приёмка,
        completed и paid блокируют отметки; архив — 409 project_archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItem"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
        "400":
          $ref: ../common/common.yaml#/components/responses/ApiBadRequest
        "401":
          $ref: ../common/common.yaml#/components/responses/ApiUnauthorized
        "403":
          $ref: ../common/common.yaml#/components/responses/ApiForbidden
        "404":
          $ref: ../common/common.yaml#/components/responses/ApiNotFound
        "409":
          $ref: ../common/common.yaml#/components/responses/ApiConflict
components:
  schemas:
    ChecklistItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - photoHint
        - position
        - isCompleted
        - requiresRework
        - completedAt
        - completedBy
      properties:
        id:
          examples:
            - 3001
          description: "ID пункта чек-листа. При замене состава чек-листа создаются новые идентификаторы пунктов."
          type: integer
          minimum: 1
          maximum: 2147483647
        title:
          examples:
            - "Проверить соответствие выполненных работ проекту"
          description: "Название контрольной точки, которую необходимо выполнить для передачи этапа на приёмку."
          type: string
          minLength: 1
          maxLength: 500
        photoHint:
          examples:
            - "Фото перевязки углов и перехлёста арматуры"
            - null
          description: "Необязательная подсказка из шаблона о том, что должно быть видно на фотографии."
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
        position:
          examples:
            - 1
          description: "Порядковый номер пункта в чек-листе, начиная с 1; определяется порядком при настройке."
          type: integer
          minimum: 1
        isCompleted:
          examples:
            - true
          description: "Признак выполнения контрольной точки."
          type: boolean
        requiresRework:
          examples:
            - false
          description: "Признак того, что пункт отмечен руководителем для повторного выполнения после возврата этапа на доработку."
          type: boolean
        completedAt:
          examples:
            - "2026-09-24T09:30:00Z"
            - null
          description: "Дата и время отметки выполнения в UTC, формат RFC 3339. Устанавливается сервером; null — пункт не выполнен."
          type:
            - string
            - "null"
          format: date-time
        completedBy:
          description: "Пользователь, отметивший выполнение; null — пункт не выполнен. Устанавливается сервером."
          anyOf:
            - $ref: ../users/users.yaml#/components/schemas/UserBrief
            - type: "null"
    Checklist:
      type: object
      additionalProperties: false
      required:
        - id
        - stageId
        - items
        - progressPercent
        - warnings
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          examples:
            - 2001
          description: "Стабильный ID чек-листа этапа."
          type: integer
          minimum: 1
          maximum: 2147483647
        stageId:
          examples:
            - 1001
          description: "Стабильный ID этапа, которому принадлежит запись."
          type: integer
          minimum: 1
          maximum: 2147483647
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
          description: Пункты индивидуального чек-листа в порядке position ASC; верхнего ограничения нет.
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 × выполненные пункты / все пункты, округление до целого. Пустой чек-лист — 0. Только
            вычисляется сервером.
          examples:
            - 33
        warnings:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - materials_incomplete
              - predecessor_incomplete
          description: Предупреждения текущего состояния. materials_incomplete означает, что работы начаты до полной комплектации материалами; predecessor_incomplete — что непосредственно предыдущий включённый этап ещё не выполнен. Предупреждения не блокируют работу.
        version:
          examples:
            - 1
          type: integer
          minimum: 1
          description: Версия записи. Увеличивается при каждом изменении.
        createdAt:
          examples:
            - "2026-09-20T08:00:00Z"
          description: "Дата и время создания записи в UTC, формат RFC 3339."
          type: string
          format: date-time
        updatedAt:
          examples:
            - "2026-09-24T10:00:00Z"
          description: "Дата и время последнего изменения записи в UTC, формат RFC 3339."
          type: string
          format: date-time
    ConfigureChecklist:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - items
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - title
            properties:
              title:
                examples:
                  - "Проверить соответствие выполненных работ проекту"
                description: "Название контрольной точки, которую необходимо выполнить для передачи этапа на приёмку."
                type: string
                minLength: 1
                maxLength: 500
              photoHint:
                examples:
                  - "Фото перевязки углов и перехлёста арматуры"
                  - null
                description: "Необязательная фотоподсказка; null удаляет подсказку."
                type:
                  - string
                  - "null"
                minLength: 1
                maxLength: 1000
          minItems: 1
          description: Порядок массива определяет position. Равный вес каждого пункта.
    UpdateChecklistItem:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - isCompleted
      properties:
        expectedVersion:
          $ref: ../common/common.yaml#/components/schemas/ExpectedVersion
        isCompleted:
          examples:
            - true
          description: "Новое состояние пункта. true отмечает выполнение, false снимает отметку; сервер заполняет или очищает completedAt и completedBy и пересчитывает прогресс."
          type: boolean
