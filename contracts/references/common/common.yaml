components:
  schemas:
    MoneyAmountMinor:
      type: integer
      format: int64
      minimum: 0
      examples:
        - 12500000
      description: Неотрицательная денежная сумма в копейках.
    WritableMoneyAmountMinor:
      type: integer
      format: int64
      minimum: 0
      multipleOf: 100
      examples:
        - 12500000
      description: Денежная сумма в копейках, вводимая пользователем. В первой версии принимает только целые рубли.
    PlannedMoneyAmountMinor:
      type:
        - integer
        - "null"
      format: int64
      minimum: 0
      multipleOf: 100
      examples:
        - 12500000
        - 0
        - null
      description: "Плановая сумма в копейках: null — план не задан; 0 — задан нулевой план. В первой версии ненулевое значение кратно 100."
    PositiveMoneyAmountMinor:
      type: integer
      format: int64
      minimum: 100
      multipleOf: 100
      examples:
        - 500000
      description: Положительная сумма платежа или счёта в копейках. В первой версии минимум 100 копеек и только целые рубли.
    SignedMoneyAmountMinor:
      type:
        - integer
        - "null"
      format: int64
      examples:
        - 250000
        - -100000
        - null
      description: "Вычисляемая разница в копейках: положительное значение — остаток, отрицательное — переплата, null — план не задан."
    ExpectedVersion:
      type: integer
      minimum: 1
      examples:
        - 1
      description: Версия ресурса из последнего чтения. Обязательна при изменении финансовых и материальных ресурсов; несовпадение возвращает 409 version_conflict без частичного изменения.
    ProjectStatus:
      type: string
      enum:
        - created
        - in_progress
        - acceptance
        - completed
      examples:
        - in_progress
      description: "Вычисляемый статус проекта: created — работы фактически не начаты; in_progress — работы идут, включая доработку последнего этапа; acceptance — последний включённый этап принят или ожидает приёмки; completed — последний включённый этап выплачен."
    StageType:
      type: string
      enum:
        - foundation
        - walls
        - roof
        - windows
        - facade
        - electrical
        - finishing
        - heating
      examples:
        - foundation
      description: foundation — Фундамент; walls — Стены; roof — Крыша; windows — Окна; facade — Фасад; electrical — Электрика; finishing — Отделка; heating — Отопление.
    StageStatus:
      type: string
      enum:
        - created
        - assigned
        - supplied
        - in_progress
        - acceptance
        - rework
        - completed
        - paid
      examples:
        - in_progress
      description: "Статус этапа в цепочке created → assigned → supplied → in_progress → acceptance → completed → paid. Работу можно начать из assigned; из acceptance возможен возврат в rework и повторный переход в acceptance."
    VariancePercent:
      type:
        - number
        - "null"
      examples:
        - 10
        - -10
        - null
      description: "Отклонение (план − факт) / план × 100. Плюс — экономия, минус — перерасход; null — план отсутствует, равен нулю или неполон."
    StageFinancialSummary:
      type: object
      additionalProperties: false
      required:
        - plannedWorkAmountMinor
        - actualWorkAmountMinor
        - workBalanceAmountMinor
        - plannedMaterialAmountMinor
        - actualMaterialAmountMinor
        - totalPlannedAmountMinor
        - totalActualAmountMinor
        - isPlanComplete
        - variancePercent
      properties:
        plannedWorkAmountMinor:
          readOnly: true
          description: Плановая стоимость работ этапа; null — план работ не задан.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        actualWorkAmountMinor:
          readOnly: true
          description: Сумма всех платежей за работы этапа.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        workBalanceAmountMinor:
          readOnly: true
          description: План работ минус фактические платежи; отрицательное значение означает переплату, null — план не задан.
          allOf:
            - $ref: "#/components/schemas/SignedMoneyAmountMinor"
        plannedMaterialAmountMinor:
          readOnly: true
          description: Плановая стоимость материалов этапа; null — план материалов не задан.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        actualMaterialAmountMinor:
          readOnly: true
          description: Сумма оплаченных счетов за материалы этапа.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        totalPlannedAmountMinor:
          readOnly: true
          description: Сумма планов работ и материалов; null, если хотя бы один план не задан.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        totalActualAmountMinor:
          readOnly: true
          description: Сумма фактических затрат на работы и материалы этапа.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        isPlanComplete:
          type: boolean
          readOnly: true
          examples:
            - true
          description: true, если заданы оба плана этапа. Нулевой план считается заданным.
        variancePercent:
          readOnly: true
          description: Процент отклонения общего плана этапа от общего факта.
          allOf:
            - $ref: "#/components/schemas/VariancePercent"
      description: Вычисляемые финансовые итоги одного этапа. Все поля доступны только для чтения.
    ProjectFinancialSummary:
      type: object
      additionalProperties: false
      required:
        - plannedWorkAmountMinor
        - actualWorkAmountMinor
        - plannedMaterialAmountMinor
        - actualMaterialAmountMinor
        - totalPlannedAmountMinor
        - totalActualAmountMinor
        - isPlanComplete
        - variancePercent
      properties:
        plannedWorkAmountMinor:
          readOnly: true
          description: Сумма планов работ включённых в расчёт этапов; null при неполном плане.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        actualWorkAmountMinor:
          readOnly: true
          description: Сумма платежей за работы включённых в расчёт этапов.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        plannedMaterialAmountMinor:
          readOnly: true
          description: Сумма планов материалов включённых в расчёт этапов; null при неполном плане.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        actualMaterialAmountMinor:
          readOnly: true
          description: Сумма оплаченных счетов за материалы включённых в расчёт этапов.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        totalPlannedAmountMinor:
          readOnly: true
          description: Общий план проекта по работам и материалам; null при неполном плане.
          allOf:
            - $ref: "#/components/schemas/PlannedMoneyAmountMinor"
        totalActualAmountMinor:
          readOnly: true
          description: Общие фактические затраты проекта на работы и материалы.
          allOf:
            - $ref: "#/components/schemas/MoneyAmountMinor"
        isPlanComplete:
          type: boolean
          readOnly: true
          examples:
            - false
          description: true, если планы работ и материалов заданы у всех включённых в расчёт этапов. Нулевые планы считаются заданными.
        variancePercent:
          readOnly: true
          description: Процент отклонения общего плана проекта от общего факта.
          allOf:
            - $ref: "#/components/schemas/VariancePercent"
      description: Вычисляемые финансовые итоги проекта. Все поля доступны только для чтения; при неполном плане плановые итоги и отклонение равны null.
    ApiErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - version_conflict
        - invalid_transition
        - idempotency_conflict
        - login_taken
        - last_manager
        - user_in_use
        - project_archived
        - unsupported_mime_type
        - file_too_large
        - checksum_mismatch
        - upload_incomplete
        - upload_expired
        - photo_limit_exceeded
        - invoice_limit_exceeded
        - rate_limited
      examples:
        - invalid_request
      description: Стабильный машинный код ошибки. Файловые коды различают MIME, размер, checksum, незавершённую и истёкшую upload-сессию.
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - message
      properties:
        error:
          examples:
            - "Bad Request"
          description: "Краткое название ошибки HTTP, соответствующее статусу ответа."
          type: string
          minLength: 1
          maxLength: 255
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          examples:
            - "Плановое окончание не может быть раньше планового начала."
          description: "Описание причины ошибки для человека."
          type: string
          minLength: 1
          maxLength: 2000
        details:
          description: "Подробности ошибок отдельных полей запроса; могут отсутствовать."
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                examples:
                  - "body.plannedEndDate"
                type: string
                minLength: 1
                maxLength: 255
                description: "Путь к полю: body.plannedEndDate, query.limit и т. п."
              message:
                examples:
                  - "Плановое окончание не может быть раньше планового начала."
                description: "Описание ошибки в поле запроса, указанном в path."
                type: string
                minLength: 1
                maxLength: 1000
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ безопасного повтора операции после потери ответа. Повтор с другим телом возвращает 409 idempotency_conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Количество пропущенных записей после фильтрации и проверки доступа.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    ApiBadRequest:
      description: Некорректные поля, формат, даты, неизвестные параметры или неподдерживаемый MIME файла. Для MIME используется код unsupported_mime_type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Bad Request
            code: invalid_request
            message: Плановое окончание не может быть раньше планового начала.
            details:
              - path: body.plannedEndDate
                message: Плановое окончание не может быть раньше планового начала.
    ApiUnauthorized:
      description: Сессионная cookie отсутствует, недействительна, истекла или отозвана. При входе — одинаковая ошибка для
        неизвестного логина, неверного пароля и неактивной учётной записи.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Unauthorized
            code: unauthenticated
            message: Не удалось подтвердить авторизацию.
    ApiForbidden:
      description: Роль не разрешает эту операцию или изменение поля.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Forbidden
            code: forbidden
            message: Недостаточно прав для выполнения операции.
    ApiNotFound:
      description: Запись не существует либо находится вне доступной пользователю области. В частности, запрос мастера к чужому этапу или его вложенному ресурсу возвращает этот ответ и не раскрывает существование записи.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Not Found
            code: not_found
            message: Запись не найдена или недоступна.
    ApiConflict:
      description: Конфликт версии, логина, зависимости, состояния, лимита счетов, checksum или upload-сессии. Изменения не применены. Повтор Idempotency-Key с другим телом возвращает idempotency_conflict; конкурентное превышение десяти счетов — invoice_limit_exceeded; файловые операции используют checksum_mismatch, upload_incomplete и upload_expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Conflict
            code: version_conflict
            message: Запись была изменена; обновите данные и повторите запрос.
    ApiPayloadTooLarge:
      description: Файл превышает допустимый для его назначения размер. Upload-сессия не завершается.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Payload Too Large
            code: file_too_large
            message: Размер файла превышает допустимый предел.
    ApiTooManyRequests:
      description: Превышен лимит запросов. Повторите через Retry-After секунд.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: Too Many Requests
            code: rate_limited
            message: Превышен лимит запросов. Повторите попытку позже.
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: stageby_session
      description: "Защищённая HttpOnly cookie серверной сессии из POST /auth/login. Браузер передаёт её автоматически.
        Сервер проверяет срок, отзыв, активность пользователя и актуальную роль при каждом запросе."
