paths:
  /stages/{stageId}/material-orders:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      deprecated: true
      operationId: listMaterialOrders
      tags: [Materials]
      summary: Заказы материалов этапа
      description: Руководитель видит любой этап, мастер — только назначенный ему. Сортировка createdAt ASC, id ASC.
      responses:
        '200':
          description: Список заказов со счетами и нехватками
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MaterialOrder' } } } }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
    post:
      deprecated: true
      operationId: createMaterialOrder
      tags: [Materials]
      summary: Создать заказ материалов
      description: Только руководитель. Один этап может иметь несколько заказов.
      responses:
        '201': { description: Заказ создан, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialOrder' } } } }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
  /material-orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      deprecated: true
      operationId: updateMaterialOrder
      tags: [Materials]
      summary: Изменить отправку заказа
      description: Только руководитель. Дата и автор отправки фиксируются сервером.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMaterialOrder' } } } }
      responses:
        '200': { description: Заказ изменён, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialOrder' } } } }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
  /material-orders/{orderId}/invoices:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      deprecated: true
      operationId: listMaterialInvoices
      tags: [Materials]
      summary: Счета заказа
      responses:
        '200': { description: Список счетов, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MaterialInvoice' } } } } }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
    post:
      deprecated: true
      operationId: createMaterialInvoice
      tags: [Materials]
      summary: Добавить счёт к заказу
      description: Только руководитель. Требуется успешно загруженный PDF или JPEG с назначением material_invoice.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMaterialInvoice' } } } }
      responses:
        '201': { description: Счёт создан, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialInvoice' } } } }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
  /stages/{stageId}/material-invoices:
    parameters:
      - $ref: '#/components/parameters/StageId'
    get:
      operationId: listStageMaterialInvoices
      tags: [Materials]
      summary: Счета материалов этапа
      description: Руководитель видит счета любого этапа, мастер — только назначенного ему. Сортировка createdAt ASC, id ASC. Заказ материалов пользователем не создаётся.
      responses:
        '200':
          description: До десяти счетов этапа со сведениями об оплате, доставке и нехватках.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/StageMaterialInvoice' }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
    post:
      operationId: createStageMaterialInvoice
      tags: [Materials]
      summary: Добавить счёт материалов к этапу
      description: Только руководитель. Привязывает к существующему этапу успешно загруженный PDF или JPEG назначения material_invoice размером не более 10 МиБ и положительную сумму. Один fileId можно привязать не более одного раза. Лимит десять счетов проверяется атомарно под блокировкой этапа; при двух конкурентных запросах на десятое место ровно один может завершиться успешно, второй получает 409 invoice_limit_exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMaterialInvoice' }
      responses:
        '201':
          description: Счёт создан.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageMaterialInvoice' }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: '#/components/responses/InvoiceConflict' }
        '413': { $ref: ../common/common.yaml#/components/responses/ApiPayloadTooLarge }
  /material-invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    patch:
      operationId: updateMaterialInvoice
      tags: [Materials]
      summary: Отметить оплату или доставку счёта
      description: Оплату меняет только руководитель. Доставку — руководитель или назначенный мастер. Даты и авторы фиксируются независимо сервером.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMaterialInvoice' } } } }
      responses:
        '200': { description: Счёт этапа изменён, content: { application/json: { schema: { $ref: '#/components/schemas/StageMaterialInvoice' } } } }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
  /material-invoices/{invoiceId}/shortages:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      operationId: createMaterialShortage
      tags: [Materials]
      summary: Сообщить о нехватке
      description: Руководитель или назначенный мастер. Добавление нового счёта не закрывает нехватку.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMaterialShortage' } } } }
      responses:
        '201': { description: Нехватка создана, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialShortage' } } } }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
  /material-shortages/{shortageId}/resolution:
    parameters:
      - name: shortageId
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
    post:
      operationId: resolveMaterialShortage
      tags: [Materials]
      summary: Закрыть нехватку
      description: Только руководитель. Повторное закрытие запрещено.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveMaterialShortage' } } } }
      responses:
        '200': { description: Нехватка закрыта, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialShortage' } } } }
        '400': { $ref: ../common/common.yaml#/components/responses/ApiBadRequest }
        '401': { $ref: ../common/common.yaml#/components/responses/ApiUnauthorized }
        '403': { $ref: ../common/common.yaml#/components/responses/ApiForbidden }
        '404': { $ref: ../common/common.yaml#/components/responses/ApiNotFound }
        '409': { $ref: ../common/common.yaml#/components/responses/ApiConflict }
components:
  responses:
    InvoiceConflict:
      description: Лимит десять счетов исчерпан, файл уже привязан либо состояние ресурса конфликтует. Изменения не применены.
      content:
        application/json:
          schema: { $ref: ../common/common.yaml#/components/schemas/ApiError }
          examples:
            invoiceLimitExceeded:
              value:
                error: Conflict
                code: invoice_limit_exceeded
                message: На этапе уже создано максимально допустимое количество счетов.
  parameters:
    StageId:
      name: stageId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
  schemas:
    MaterialOrder:
      type: object
      additionalProperties: false
      required: [id, stageId, sentAt, sentBy, invoices, version, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1, maximum: 2147483647, example: 301, description: Идентификатор заказа. }
        stageId: { type: integer, minimum: 1, maximum: 2147483647, example: 101, description: Идентификатор этапа. }
        sentAt: { type: [string, 'null'], format: date-time, example: '2026-10-01T08:00:00Z', description: Время отправки или null. }
        sentBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор отправки или null. }
        invoices: { type: array, items: { $ref: '#/components/schemas/MaterialInvoice' }, description: Счета этого заказа. }
        version: { type: integer, minimum: 1, example: 1, description: Версия заказа. }
        createdAt: { type: string, format: date-time, example: '2026-10-01T07:00:00Z', description: Время создания. }
        updatedAt: { type: string, format: date-time, example: '2026-10-01T08:00:00Z', description: Время изменения. }
    UpdateMaterialOrder:
      type: object
      additionalProperties: false
      required: [expectedVersion, isSent]
      properties:
        expectedVersion: { $ref: ../common/common.yaml#/components/schemas/ExpectedVersion }
        isSent: { type: boolean, example: true, description: Требуемая отметка отправки. }
    MaterialInvoice:
      type: object
      additionalProperties: false
      required: [id, orderId, fileId, supplierName, amountMinor, paidAt, paidBy, deliveredAt, deliveredBy, shortages, version, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1, maximum: 2147483647, example: 401, description: Идентификатор счёта. }
        orderId: { type: integer, minimum: 1, maximum: 2147483647, example: 301, description: Идентификатор заказа. }
        fileId: { type: integer, minimum: 1, maximum: 2147483647, example: 201, description: Идентификатор файла счёта. }
        supplierName: { type: [string, 'null'], minLength: 1, maxLength: 255, example: Стройснаб, description: Поставщик или null. }
        amountMinor: { $ref: ../common/common.yaml#/components/schemas/PositiveMoneyAmountMinor, description: Сумма счёта в копейках. }
        paidAt: { type: [string, 'null'], format: date-time, example: '2026-10-02T08:00:00Z', description: Время оплаты или null. }
        paidBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор отметки оплаты или null. }
        deliveredAt: { type: [string, 'null'], format: date-time, example: '2026-10-03T08:00:00Z', description: Время доставки или null. }
        deliveredBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор отметки доставки или null. }
        shortages: { type: array, items: { $ref: '#/components/schemas/MaterialShortage' }, description: Сообщения о нехватке. }
        version: { type: integer, minimum: 1, example: 1, description: Версия счёта. }
        createdAt: { type: string, format: date-time, example: '2026-10-01T08:00:00Z', description: Время создания. }
        updatedAt: { type: string, format: date-time, example: '2026-10-03T08:00:00Z', description: Время изменения. }
    StageMaterialInvoice:
      type: object
      additionalProperties: false
      required: [id, stageId, fileId, supplierName, amountMinor, paidAt, paidBy, deliveredAt, deliveredBy, shortages, version, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1, maximum: 2147483647, example: 401, description: Идентификатор счёта. }
        stageId: { type: integer, minimum: 1, maximum: 2147483647, example: 101, description: "Этап, к которому напрямую относится счёт." }
        fileId: { type: integer, minimum: 1, maximum: 2147483647, example: 201, description: Идентификатор загруженного файла счёта. }
        supplierName: { type: [string, 'null'], minLength: 1, maxLength: 255, example: Стройснаб, description: Поставщик или null. }
        amountMinor: { $ref: ../common/common.yaml#/components/schemas/PositiveMoneyAmountMinor, description: Полная сумма счёта в копейках. Частичная оплата одного счёта не поддерживается. }
        paidAt: { type: [string, 'null'], format: date-time, example: '2026-10-02T08:00:00Z', description: Серверное время отметки полной оплаты или null. }
        paidBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор отметки оплаты или null. }
        deliveredAt: { type: [string, 'null'], format: date-time, example: '2026-10-03T08:00:00Z', description: Серверное время отметки доставки или null. }
        deliveredBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор отметки доставки или null. }
        shortages: { type: array, items: { $ref: '#/components/schemas/MaterialShortage' }, description: "Нехватки счёта в порядке reportedAt ASC, id ASC." }
        version: { type: integer, minimum: 1, example: 1, description: Версия счёта для последующих изменений. }
        createdAt: { type: string, format: date-time, example: '2026-10-01T08:00:00Z', description: Время создания в UTC. }
        updatedAt: { type: string, format: date-time, example: '2026-10-03T08:00:00Z', description: Время изменения в UTC. }
    CreateMaterialInvoice:
      type: object
      additionalProperties: false
      required: [fileId, amountMinor]
      properties:
        fileId: { type: integer, minimum: 1, maximum: 2147483647, example: 201, description: Успешно загруженный файл счёта. }
        supplierName: { type: [string, 'null'], minLength: 1, maxLength: 255, example: Стройснаб, description: Необязательное имя поставщика. }
        amountMinor: { $ref: ../common/common.yaml#/components/schemas/PositiveMoneyAmountMinor, description: Положительная сумма в копейках. }
    UpdateMaterialInvoice:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: ../common/common.yaml#/components/schemas/ExpectedVersion }
        isPaid: { type: boolean, example: true, description: Требуемая отметка оплаты. }
        isDelivered: { type: boolean, example: true, description: Требуемая отметка доставки. }
    MaterialShortage:
      type: object
      additionalProperties: false
      required: [id, invoiceId, comment, reportedAt, reportedBy, resolvedAt, resolvedBy, resolutionComment, version]
      properties:
        id: { type: integer, minimum: 1, maximum: 2147483647, example: 501, description: Идентификатор нехватки. }
        invoiceId: { type: integer, minimum: 1, maximum: 2147483647, example: 401, description: Идентификатор счёта. }
        comment: { type: string, minLength: 1, maxLength: 500, example: Не доставлены крепёжные элементы, description: Описание нехватки. }
        reportedAt: { type: string, format: date-time, example: '2026-10-03T09:00:00Z', description: Время сообщения. }
        reportedBy: { $ref: ../users/users.yaml#/components/schemas/UserBrief, description: Автор сообщения. }
        resolvedAt: { type: [string, 'null'], format: date-time, example: '2026-10-04T09:00:00Z', description: Время устранения или null. }
        resolvedBy: { anyOf: [{ $ref: ../users/users.yaml#/components/schemas/UserBrief }, { type: 'null' }], description: Автор устранения или null. }
        resolutionComment: { type: [string, 'null'], minLength: 1, maxLength: 500, example: Комплект доставлен отдельно, description: Итоговый комментарий или null. }
        version: { type: integer, minimum: 1, example: 1, description: Версия нехватки. }
    CreateMaterialShortage:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 500, example: Не доставлены крепёжные элементы, description: Описание нехватки. }
    ResolveMaterialShortage:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: ../common/common.yaml#/components/schemas/ExpectedVersion }
        resolutionComment: { type: [string, 'null'], minLength: 1, maxLength: 500, example: Комплект доставлен отдельно, description: Необязательный итоговый комментарий. }
