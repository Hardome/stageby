services:
  postgres:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: stageby_tests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'stageby_tests']
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    build:
      context: ../../..
      dockerfile: infrastructure/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: stageby
      MINIO_ROOT_PASSWORD: stageby-development
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    command: server /data
    tmpfs: ['/data']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30

  check:
    image: ${STAGEBY_CHECK_IMAGE:-stageby-check:local}
    cpus: 2
    mem_limit: 4g
    build:
      context: ../../..
      dockerfile: infrastructure/production/build/Dockerfile
      target: verify
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql://postgres:isolated-test-password@postgres:5432/stageby_tests
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: stageby-tests
      S3_ACCESS_KEY_ID: stageby
      S3_SECRET_ACCESS_KEY: stageby-development
      S3_CREATE_BUCKET: 'true'
      CORS_ORIGIN: http://localhost:3000
      KUBB_DISABLE_TELEMETRY: '1'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
