version: "0.2"
language: en, en-US, ru, ru-RU
import:
  - "@cspell/dict-ru_ru/cspell-ext.json"
useGitignore: true
enableGlobDot: true
words:
  - codegen
  - Filenaming
  - healthcheck
  - isready
  - Kubb
  - nosniff
  - Redocly
  - shadcn
  - segmentless
  - Stageby
  - Steiger
  - tanstack
  - Trixie
  - автораспределения
  - Автосоздание
  - Купидом
  - Межполевые
  - фотоподтверждения
  - Штро
  - автоинкремент
ignorePaths:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/pnpm-lock.yaml"
  - "**/*.tsbuildinfo"
  - api/src/generated/**
  - web/src/generated/**
  - api/src/db/migrations/**
